<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Command Center</title>
<meta name="description" content="The local ledger of everything built in Claude Code sessions on this Mac.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* ============================================================ tokens
   Material: aged drafting film and mineral pigment. A month of sessions is
   sediment; the record is a drill core. Light is the film, dark is the core
   store at night. Nine pigments, one per kind of thing built. */
:root{
  color-scheme: light;
  --film:#EBE4D5; --bed:#DCD2BA; --bedfill:#F1EBDD; --panel:#F3EEE3; --sunk:#DED5BF;
  --ink:#171309; --ink-2:#57503E; --ink-3:#6A6353;
  --rule:#C9BC9F; --hair:#DBD1B9;
  --vug:#9E3418; --vug-soft:#C9694C;
  --k-build:#A9741A; --k-enhancement:#2C6549; --k-fix:#9E3418; --k-research:#265479;
  --k-doc:#485460; --k-config:#6E6A22; --k-automation:#146661; --k-analysis:#414C8C; --k-other:#6B6454;
  --focus:#1F5E86;
  --shadow:0 1px 0 rgba(23,19,9,.06), 0 10px 26px -20px rgba(23,19,9,.5);
  --serif:"IBM Plex Serif","Iowan Old Style",Charter,"Palatino Linotype",Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --rail:196px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  color-scheme: dark;
  --film:#100E0A; --bed:#15120D; --bedfill:#231F17; --panel:#16130E; --sunk:#0A0907;
  --ink:#EFE7D4; --ink-2:#A79E88; --ink-3:#8A8170;
  --rule:#3A342A; --hair:#282318;
  --vug:#E0714E; --vug-soft:#A24E34;
  --k-build:#DBA63F; --k-enhancement:#5FB88D; --k-fix:#E2775A; --k-research:#77AEDC;
  --k-doc:#A6B4C0; --k-config:#B7BE5E; --k-automation:#54C3B8; --k-analysis:#98A2E8; --k-other:#B0A794;
  --focus:#8FC4E8;
  --shadow:0 1px 0 rgba(0,0,0,.5), 0 14px 34px -22px #000;
}}
:root[data-theme="dark"]{
  color-scheme: dark;
  --film:#100E0A; --bed:#15120D; --bedfill:#231F17; --panel:#16130E; --sunk:#0A0907;
  --ink:#EFE7D4; --ink-2:#A79E88; --ink-3:#8A8170;
  --rule:#3A342A; --hair:#282318;
  --vug:#E0714E; --vug-soft:#A24E34;
  --k-build:#DBA63F; --k-enhancement:#5FB88D; --k-fix:#E2775A; --k-research:#77AEDC;
  --k-doc:#A6B4C0; --k-config:#B7BE5E; --k-automation:#54C3B8; --k-analysis:#98A2E8; --k-other:#B0A794;
  --focus:#8FC4E8;
  --shadow:0 1px 0 rgba(0,0,0,.5), 0 14px 34px -22px #000;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--film); color:var(--ink);
  font:400 15px/1.55 var(--serif);
  font-variant-numeric:tabular-nums lining-nums;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
.num,code,kbd,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
a{color:inherit;text-decoration:none;border-bottom:1px solid var(--rule)}
a:hover{border-bottom-color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:2px}
.skip{position:absolute;left:-9999px;top:0;z-index:60;background:var(--panel);padding:10px 16px;border:1px solid var(--ink)}
.skip:focus{left:12px;top:12px}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ============================================================ shell */
.shell{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100vh}
.rail{
  border-right:1px solid var(--rule); background:var(--panel);
  padding:22px 0 18px; position:sticky; top:0; height:100vh; overflow-y:auto;
  display:flex; flex-direction:column; gap:4px;
}
.mark{padding:0 20px 20px;display:flex;gap:11px;align-items:flex-start}
.mark svg{flex:none;margin-top:2px}
.mark b{display:block;font:500 15.5px/1.2 var(--serif);letter-spacing:.005em}
.mark span{display:block;font:300 12.5px/1.35 var(--serif);font-style:italic;color:var(--ink-3);margin-top:2px}
.railgroup{padding:12px 20px 5px;font:300 italic 12.5px/1 var(--serif);color:var(--ink-3)}
#navlinks{display:flex;flex-direction:column;min-width:0}
.rail a.nav{
  display:flex;gap:11px;align-items:center;padding:7px 20px;border:0;
  color:var(--ink-2);font:400 14.5px/1.3 var(--serif);position:relative;
}
.rail a.nav svg{flex:none;opacity:.75}
.rail a.nav:hover{color:var(--ink);background:var(--bed)}
.rail a.nav[aria-current="page"]{color:var(--ink);font-weight:500}
.rail a.nav[aria-current="page"]::before{content:"";position:absolute;left:0;top:5px;bottom:5px;width:3px;background:var(--ink)}
.rail a.nav[aria-disabled="true"]{color:var(--ink-3);opacity:.72;cursor:default}
.rail a.nav[aria-disabled="true"]:hover{background:none;color:var(--ink-3)}
.rail a.nav em{margin-left:auto;font:300 italic 11.5px/1 var(--serif);color:var(--ink-3)}
.railfoot{margin-top:auto;padding:14px 20px 0;border-top:1px solid var(--hair);display:flex;flex-direction:column;gap:8px}
.ghostbtn{background:none;border:1px solid var(--rule);padding:5px 10px;border-radius:2px;cursor:pointer;
  font:400 13px/1.3 var(--serif);color:var(--ink-2);display:inline-flex;gap:7px;align-items:center}
.ghostbtn:hover{border-color:var(--ink);color:var(--ink)}
.railfoot small{font:300 italic 11.5px/1.4 var(--serif);color:var(--ink-3)}

main{min-width:0;padding:0 0 64px}
.wrap{padding:0 clamp(18px,3.2vw,44px)}

/* ============================================================ masthead */
.masthead{padding:28px 0 16px;border-bottom:1px solid var(--hair)}
.masthead h1{margin:0;font:300 clamp(28px,3.7vw,44px)/1.04 var(--serif);letter-spacing:-.018em}
.masthead h1 i{font-style:italic;font-weight:300;color:var(--ink-2)}
.readout{margin:11px 0 0;max-width:60ch;font:300 clamp(14px,1.2vw,16px)/1.6 var(--serif);color:var(--ink-2)}
.readout b{font-family:var(--mono);font-weight:500;font-size:.92em;color:var(--ink)}
.readout .warn{color:var(--vug)}
.stamp{margin:8px 0 0;font:300 italic 12px/1.5 var(--serif);color:var(--ink-3);max-width:88ch}
.stamp code{font-size:11.5px;font-style:normal}

/* ============================================================ core log */
.corewrap{margin:22px 0 0;position:relative}
.corehead{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:9px}
.corehead h2{margin:0;font:400 16px/1.2 var(--serif)}
.corehead p{margin:0;font:300 italic 13px/1.4 var(--serif);color:var(--ink-2);max-width:56ch}
.corestage{position:relative;border:1px solid var(--rule);background:var(--bed);border-radius:2px;overflow:hidden}
.sheethead h2:focus-visible{outline-offset:5px}
#corelog{display:block;width:100%;touch-action:pan-y}
.tip{
  position:absolute;pointer-events:none;z-index:10;max-width:300px;
  background:var(--panel);border:1px solid var(--ink);box-shadow:var(--shadow);
  padding:9px 11px;border-radius:2px;opacity:0;transition:opacity .12s
}
.tip[data-on="1"]{opacity:1}
.tip b{display:block;font:500 14px/1.3 var(--serif)}
.tip span{display:block;margin-top:3px;font:300 12.5px/1.45 var(--serif);color:var(--ink-2)}
.tip .kindline{font-style:italic}
.legend{display:flex;flex-wrap:wrap;gap:5px 16px;margin:10px 0 0;align-items:center}
.legend button{
  background:none;border:0;padding:2px 0;cursor:pointer;display:inline-flex;gap:6px;align-items:center;
  font:300 12.5px/1.3 var(--serif);color:var(--ink-2);border-bottom:1px solid transparent
}
.legend button:hover{color:var(--ink)}
.legend button[aria-pressed="true"]{color:var(--ink);border-bottom-color:currentColor}
.legend .sw{width:11px;height:11px;flex:none;border-radius:1px}
.legend .sw.hollow{border:1.5px dashed var(--vug);background:none;border-radius:50%}
.legend .spacer{flex:1 1 30px}
.brushnote{font:300 italic 12.5px/1.3 var(--serif);color:var(--ink-2)}
.brushnote button{background:none;border:0;border-bottom:1px solid var(--rule);cursor:pointer;color:inherit;font:inherit;padding:0}
details.alt{margin:10px 0 0}
details.alt>summary{cursor:pointer;font:300 italic 12.5px/1.4 var(--serif);color:var(--ink-3);list-style:none}
details.alt>summary::-webkit-details-marker{display:none}
details.alt>summary::before{content:"+ ";font-style:normal}
details.alt[open]>summary::before{content:"\2212 "}
details.alt>summary:hover{color:var(--ink)}
.alttable{max-height:320px;overflow:auto;border:1px solid var(--hair);margin-top:8px}
.alttable table{width:100%;border-collapse:collapse;font:400 12.5px/1.4 var(--mono)}
.alttable th,.alttable td{text-align:left;padding:5px 9px;border-bottom:1px solid var(--hair);white-space:nowrap}
.alttable th{position:sticky;top:0;background:var(--panel);font-weight:500}

/* ============================================================ ledger */
.ledger{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.02fr);gap:0;margin-top:30px;
  border-top:1px solid var(--rule)}
.listcol{border-right:1px solid var(--hair);min-width:0}
.tools{padding:16px 0 12px;display:flex;flex-direction:column;gap:11px;padding-right:20px}
.searchrow{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--rule);padding-bottom:7px}
.searchrow svg{flex:none;opacity:.6}
#q{flex:1;background:none;border:0;padding:3px 0;font:300 17px/1.4 var(--serif);min-width:0}
#q::placeholder{color:var(--ink-3);font-style:italic}
#q:focus{outline:0}
.searchrow kbd{font:400 11px/1 var(--mono);border:1px solid var(--rule);padding:3px 5px;border-radius:2px;color:var(--ink-3)}
.filters{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.filters .fgroup{display:flex;flex-wrap:wrap;gap:4px 9px;align-items:center}
.filters .flabel{font:300 italic 12.5px/1.3 var(--serif);color:var(--ink-3);margin-right:1px}
.chip{background:none;border:0;padding:2px 0;cursor:pointer;font:400 13px/1.35 var(--serif);color:var(--ink-2);
  border-bottom:1px solid transparent;white-space:nowrap}
.chip:hover{color:var(--ink)}
.chip[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:500}
.chip .ct{font:400 11px/1 var(--mono);color:var(--ink-3);margin-left:4px}
select.sel{background:none;border:0;border-bottom:1px solid var(--rule);padding:2px 18px 2px 2px;cursor:pointer;
  font:400 13px/1.35 var(--serif);-webkit-appearance:none;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 9px) 9px,calc(100% - 5px) 9px;background-size:4px 4px;background-repeat:no-repeat}
.countline{font:300 italic 12.5px/1.4 var(--serif);color:var(--ink-3);display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}

.rows{list-style:none;margin:0;padding:0 20px 0 0;max-height:none}
.rows:focus{outline:0}
.rows:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.row{position:relative;padding:13px 12px 13px 15px;border-bottom:1px solid var(--hair);cursor:pointer}
.row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--kc,var(--rule));opacity:.5}
.row:hover{background:var(--bed)}
.row[aria-selected="true"]{background:var(--bed)}
.row[aria-selected="true"]::before{opacity:1;width:4px}
.row .rid{font:400 11px/1 var(--mono);color:var(--ink-3)}
.row h3{margin:1px 0 0;font:400 16.5px/1.32 var(--serif);letter-spacing:-.004em}
.row .meta{margin:5px 0 0;font:300 12.5px/1.45 var(--serif);color:var(--ink-2);display:flex;flex-wrap:wrap;gap:3px 13px}
.row .meta .kind{color:var(--kc);font-style:italic}
.row .meta .date{font-family:var(--mono);font-size:11.5px}
.row .snip{margin:5px 0 0;font:300 italic 13px/1.5 var(--serif);color:var(--ink-2);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row .snip mark{background:none;color:var(--ink);font-weight:500;font-style:normal}
.row .flags{font:400 11px/1 var(--mono);color:var(--ink-3)}
.row .flags .inf{color:var(--vug-soft)}
.more{display:block;width:100%;margin:14px 0;padding:9px;background:none;border:1px dashed var(--rule);cursor:pointer;
  font:300 italic 13px/1 var(--serif);color:var(--ink-2);border-radius:2px}
.more:hover{border-color:var(--ink);color:var(--ink)}
.empty{padding:44px 12px;font:300 italic 15px/1.6 var(--serif);color:var(--ink-3);max-width:44ch}

/* ============================================================ specimen sheet */
.sheetcol{min-width:0;position:relative}
.sheet{position:sticky;top:0;max-height:100vh;overflow-y:auto;padding:18px 0 40px 26px}
.sheet .placeholder{padding:56px 0 0;max-width:40ch;font:300 italic 15px/1.65 var(--serif);color:var(--ink-3)}
.sheethead{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;border-bottom:1px solid var(--rule);padding-bottom:12px}
.sheethead .idline{font:400 11.5px/1.4 var(--mono);color:var(--ink-3)}
.sheethead h2{margin:3px 0 0;font:400 24px/1.22 var(--serif);letter-spacing:-.012em}
.sheethead .kindmark{display:inline-flex;align-items:center;gap:7px;font:300 italic 13px/1 var(--serif);color:var(--kc);margin-top:8px}
.sheethead .kindmark .sw{width:10px;height:10px;background:var(--kc);border-radius:1px}
.closex{background:none;border:0;cursor:pointer;padding:4px;color:var(--ink-3);line-height:0}
.closex:hover{color:var(--ink)}
.sheet section{padding:16px 0;border-bottom:1px solid var(--hair)}
.sheet h4{margin:0 0 7px;font:300 italic 13px/1 var(--serif);color:var(--ink-3)}
.prose{font:300 14.5px/1.68 var(--serif);color:var(--ink);max-width:62ch}
.prose p{margin:0 0 9px}
.prose ul{margin:0 0 9px;padding-left:19px}
.prose li{margin:2px 0}
.prose code{background:var(--bed);padding:1px 5px;border-radius:2px;font-size:12.5px;border:1px solid var(--hair)}
.prose strong{font-weight:600}
.filelist,.linklist{list-style:none;margin:0;padding:0}
.filelist li{display:flex;gap:10px;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--hair)}
.filelist li:last-child{border-bottom:0}
.filelist .role{font:300 italic 11.5px/1.4 var(--serif);color:var(--ink-3);width:62px;flex:none}
.filepath{background:none;border:0;padding:0;text-align:left;cursor:pointer;font:400 12.5px/1.5 var(--mono);
  color:var(--ink);word-break:break-all;flex:1;min-width:0}
.filepath:hover{color:var(--focus)}
.filepath .dir{color:var(--ink-3)}
.filelist .sz{font:400 11px/1.5 var(--mono);color:var(--ink-3);flex:none}
.badge{font:400 10.5px/1 var(--mono);padding:3px 5px;border-radius:2px;border:1px solid var(--rule);color:var(--ink-3);flex:none}
.badge.gone{border-color:var(--vug);color:var(--vug)}
.linklist li{padding:4px 0}
.linklist a{font:400 13.5px/1.5 var(--serif)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 16px;font:400 12.5px/1.5 var(--mono);align-items:baseline}
.kv dt{font:300 italic 12.5px/1.5 var(--serif);color:var(--ink-3)}
.kv dd{margin:0;word-break:break-all}
.actions{display:flex;flex-wrap:wrap;gap:9px;padding-top:16px}
.btn{background:none;border:1px solid var(--rule);padding:7px 13px;border-radius:2px;cursor:pointer;
  font:400 13.5px/1.3 var(--serif);color:var(--ink)}
.btn:hover{border-color:var(--ink);background:var(--bed)}
.btn.primary{border-color:var(--ink);background:var(--ink);color:var(--film)}
.btn.primary:hover{opacity:.86;background:var(--ink)}
.btn.danger{color:var(--vug);border-color:var(--vug-soft)}
.btn.danger:hover{background:var(--vug);color:var(--film);border-color:var(--vug)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.field{display:block;margin:0 0 12px}
.field>span{display:block;font:300 italic 12.5px/1.4 var(--serif);color:var(--ink-3);margin-bottom:4px}
.field input,.field textarea,.field select{
  width:100%;background:var(--panel);border:1px solid var(--rule);border-radius:2px;padding:8px 10px;
  font:400 13.5px/1.55 var(--serif);color:var(--ink)}
.field textarea{resize:vertical;min-height:84px}
.field .hint{font:400 11px/1.4 var(--mono);color:var(--ink-3);margin-top:3px;display:block}
.field .hint.bad{color:var(--vug)}
.inline2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}

/* ============================================================ audit + today */
.viewhead{padding:18px 0 0}
.viewhead h2{margin:0;font:300 clamp(26px,3.4vw,38px)/1.06 var(--serif);letter-spacing:-.016em}
.viewhead p{margin:0;max-width:64ch;font:300 italic 14.5px/1.6 var(--serif);color:var(--ink-2)}
.gapstage{border:1px solid var(--rule);background:var(--bed);border-radius:2px;overflow:hidden;margin:14px 0 0}
#gapstrip{display:block;width:100%}
.register{width:100%;border-collapse:collapse;margin-top:22px;font:400 13.5px/1.5 var(--serif)}
.register caption{text-align:left;font:300 italic 13px/1.4 var(--serif);color:var(--ink-3);padding-bottom:8px}
.register th{text-align:left;font:300 italic 12.5px/1.3 var(--serif);color:var(--ink-3);
  border-bottom:1px solid var(--rule);padding:0 12px 7px 0;white-space:nowrap}
.register td{padding:11px 12px 11px 0;border-bottom:1px solid var(--hair);vertical-align:top}
.register tr:hover td{background:var(--bed)}
.register .when{font:400 11.5px/1.5 var(--mono);color:var(--ink-2);white-space:nowrap}
.register .who{font:400 13.5px/1.4 var(--serif)}
.register .who small{display:block;font:400 11px/1.4 var(--mono);color:var(--ink-3)}
.register .said{font:300 italic 13px/1.5 var(--serif);color:var(--ink-2);max-width:42ch}
.register .figs{font:400 11.5px/1.5 var(--mono);color:var(--ink-2);white-space:nowrap}
.state{display:inline-flex;align-items:center;gap:6px;font:400 12px/1 var(--mono);white-space:nowrap}
.state::before{content:"";width:9px;height:9px;border-radius:50%;border:1.5px solid currentColor}
.state.bypassed{color:var(--vug)}
.state.unlogged{color:var(--ink-2)}
.state.waived{color:var(--ink-3)}
.state.waived::before{background:currentColor;border-radius:1px;transform:rotate(45deg)}
.state.logged{color:var(--k-enhancement)}
.state.logged::before{background:currentColor}
.rowacts{display:flex;gap:8px;flex-wrap:wrap}
.tinybtn{background:none;border:1px solid var(--rule);padding:4px 9px;border-radius:2px;cursor:pointer;
  font:400 12px/1.3 var(--serif);color:var(--ink-2);white-space:nowrap}
.tinybtn:hover{border-color:var(--ink);color:var(--ink)}
.today{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:0 44px;margin-top:8px}
.today h3{margin:22px 0 9px;font:300 italic 14px/1.3 var(--serif);color:var(--ink-3)}
.stack{list-style:none;margin:0;padding:0}
.stack li{padding:9px 0;border-bottom:1px solid var(--hair)}
.stack a{border:0}
.stack .t{font:400 15px/1.4 var(--serif)}
.stack .m{font:300 12.5px/1.45 var(--serif);color:var(--ink-2);margin-top:2px}
.stack .m .date{font-family:var(--mono);font-size:11.5px}
.bigfig{font:300 clamp(30px,3.6vw,42px)/1.05 var(--mono);letter-spacing:-.03em;display:inline}
.bigfig.warn{color:var(--vug)}
.figcap{font:300 15px/1.55 var(--serif);color:var(--ink-2);max-width:40ch;display:inline}
.figblock{padding:14px 0;border-bottom:1px solid var(--hair)}

/* ============================================================ dialogs, toast */
dialog{border:1px solid var(--ink);background:var(--panel);color:var(--ink);border-radius:2px;
  padding:22px 24px;max-width:min(440px,92vw);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(16,14,10,.5)}
dialog h3{margin:0 0 8px;font:400 19px/1.25 var(--serif)}
dialog p{margin:0 0 14px;font:300 14px/1.6 var(--serif);color:var(--ink-2)}
dialog .actions{padding-top:0}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(8px);z-index:70;
  background:var(--ink);color:var(--film);padding:9px 16px;border-radius:2px;font:400 13.5px/1.4 var(--serif);
  opacity:0;pointer-events:none;transition:opacity .16s,transform .16s;max-width:86vw}
#toast[data-on="1"]{opacity:1;transform:translateX(-50%) translateY(0)}
.loading{padding:40px 0;font:300 italic 14px/1.5 var(--serif);color:var(--ink-3)}
.fail{padding:26px;border:1px solid var(--vug);border-radius:2px;margin:20px 0;max-width:60ch}
.fail h3{margin:0 0 6px;font:400 17px/1.3 var(--serif);color:var(--vug)}
.fail p{margin:0 0 6px;font:300 14px/1.6 var(--serif);color:var(--ink-2)}
.fail code{font-size:12.5px;background:var(--bed);padding:1px 5px}

/* ============================================================ status strip */
.strip{display:flex;flex-wrap:wrap;align-items:center;gap:0;margin:12px 0 0;border-top:1px solid var(--hair);padding-top:9px}
.strip .unit{display:flex;align-items:baseline;gap:7px;padding:2px 15px 2px 0;margin-right:15px;border-right:1px solid var(--hair);white-space:nowrap}
.strip .unit:last-child{border-right:0;margin-right:0}
.strip .lb{font:300 italic 12px/1.4 var(--serif);color:var(--ink-3)}
.strip .vl{font:500 12.5px/1.4 var(--mono);color:var(--ink)}
.strip .vl.warn{color:var(--vug)}
.strip .vl.good{color:var(--k-enhancement)}
.strip a.unit{border-bottom:0}
.strip a.unit:hover .vl{text-decoration:underline}
.meter{position:relative;width:54px;height:7px;border:1px solid var(--rule);border-radius:1px;overflow:hidden;flex:none;align-self:center}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--k-enhancement);display:block}
.meter.warm i{background:var(--k-build)}
.meter.hot i{background:var(--vug)}
.pulsedot{width:8px;height:8px;border-radius:50%;background:var(--k-enhancement);flex:none;align-self:center}
.pulsedot.idle{background:var(--k-build)}
.pulsedot.cold{background:var(--ink-3)}
@keyframes beat{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.78)}}
.pulsedot.active{animation:beat 1.9s ease-in-out infinite}

/* ============================================================ shared view furniture */
.cols{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:0 46px;align-items:start}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 40px;align-items:start}
h3.sec{margin:26px 0 8px;font:300 italic 14px/1.3 var(--serif);color:var(--ink-3);
  border-bottom:1px solid var(--hair);padding-bottom:6px}
h3.sec:first-child{margin-top:16px}
.rank{list-style:none;margin:0;padding:0}
.rank li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;align-items:baseline;padding:6px 0;
  border-bottom:1px solid var(--hair);position:relative}
.rank li .bar{position:absolute;left:-6px;right:auto;bottom:0;height:2px;background:var(--kc,var(--ink-3));opacity:.5}
.rank .nm{font:400 14px/1.4 var(--serif);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .nm small{display:block;font:300 italic 12px/1.4 var(--serif);color:var(--ink-3);white-space:normal}
.rank .fg{font:400 12.5px/1.4 var(--mono);color:var(--ink-2);text-align:right;white-space:nowrap}
.rank .fg b{font-weight:500;color:var(--ink)}
.rank a{border-bottom:0}
.rank a:hover .nm{text-decoration:underline}
.note-line{font:300 italic 12.5px/1.55 var(--serif);color:var(--ink-3);margin:10px 0 0;max-width:66ch}
.stub{padding:26px 0;max-width:56ch}
.stub h3{margin:0 0 6px;font:400 17px/1.3 var(--serif)}
.stub p{margin:0 0 8px;font:300 14px/1.6 var(--serif);color:var(--ink-2)}
.stub code{font-family:var(--mono);font-size:12.5px;background:var(--bed);padding:1px 5px;border:1px solid var(--hair)}
.instage{border:1px solid var(--rule);background:var(--bed);border-radius:2px;overflow:hidden;margin:10px 0 0;position:relative}
.instage canvas{display:block;width:100%}
.toolrow{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;margin:12px 0 0}
.searchline{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--rule);padding-bottom:7px;margin-top:6px}
.searchline input{flex:1;background:none;border:0;padding:3px 0;font:300 16px/1.4 var(--serif);min-width:0}
.searchline input:focus{outline:0}
.searchline input::placeholder{color:var(--ink-3);font-style:italic}

/* ============================================================ heat grid */
.heat{display:grid;grid-template-columns:auto repeat(24,minmax(0,1fr));gap:2px;margin-top:10px;min-width:0}
.heat .hlab{font:400 10px/1 var(--mono);color:var(--ink-3);align-self:center;padding-right:6px;text-align:right}
.heat .cell{aspect-ratio:1;border-radius:1px;background:var(--kc);min-height:9px}
.heat .htop{font:400 9.5px/1 var(--mono);color:var(--ink-3);text-align:center;padding-bottom:2px}

/* ============================================================ board (today) */
.board{list-style:none;margin:0;padding:0}
.board li{display:flex;gap:12px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--hair)}
.board .bk{font:300 italic 11.5px/1.5 var(--serif);color:var(--ink-3);width:56px;flex:none}
.board .bt{flex:1;min-width:0;font:400 14.5px/1.4 var(--serif)}
.board .bt small{display:block;font:300 12px/1.4 var(--mono);color:var(--ink-3);word-break:break-all}
.board .gone{color:var(--vug);font-style:italic}
.notelist{list-style:none;margin:0;padding:0}
.notelist li{padding:10px 0;border-bottom:1px solid var(--hair);display:flex;gap:12px;align-items:baseline}
.notelist .nt{flex:1;font:300 14.5px/1.6 var(--serif);white-space:pre-wrap;word-break:break-word}
.notelist .nd{font:400 11px/1.5 var(--mono);color:var(--ink-3);flex:none}
.notebox{display:flex;gap:10px;align-items:flex-end;margin-top:10px}
.notebox textarea{flex:1;background:var(--panel);border:1px solid var(--rule);border-radius:2px;padding:8px 10px;
  font:300 14px/1.55 var(--serif);resize:vertical;min-height:46px}

/* ============================================================ tables for module views */
.grid{width:100%;border-collapse:collapse;margin-top:10px;font:400 13.5px/1.5 var(--serif)}
.grid caption{text-align:left;font:300 italic 12.5px/1.5 var(--serif);color:var(--ink-2);padding-bottom:8px;max-width:70ch}
.grid th{text-align:left;font:300 italic 12.5px/1.3 var(--serif);color:var(--ink-3);border-bottom:1px solid var(--rule);
  padding:0 12px 7px 0;white-space:nowrap}
.grid td{padding:10px 12px 10px 0;border-bottom:1px solid var(--hair);vertical-align:top}
.grid tr:hover td{background:var(--bed)}
.grid .m{font:400 12px/1.5 var(--mono);color:var(--ink-2)}
.grid .t{font:400 14px/1.4 var(--serif)}
.grid .t small{display:block;font:400 11.5px/1.5 var(--mono);color:var(--ink-3);word-break:break-word;
  overflow:hidden;text-overflow:ellipsis;max-width:52ch}
.grid td.acts{width:1%;white-space:nowrap}
.grid td.acts .rowacts{flex-wrap:nowrap}
.grid td.nowrap{white-space:nowrap}
.grid .said{font:300 italic 13px/1.5 var(--serif);color:var(--ink-2);max-width:40ch}
.dot{display:inline-flex;align-items:center;gap:7px;font:400 12px/1 var(--mono);white-space:nowrap}
.dot::before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor;flex:none}
.dot.healthy,.dot.running,.dot.active{color:var(--k-enhancement)}
.dot.stale,.dot.idle{color:var(--k-build)}
.dot.failing,.dot.error{color:var(--vug)}
.dot.unknown{color:var(--ink-3)}
.dot.notloaded{color:var(--ink-3)}
.dot.notloaded::before{background:none;border:1.5px solid currentColor}
.dot.unknown::before{background:none;border:1.5px dashed currentColor}
.logtail{margin:8px 0 0;padding:10px 12px;background:var(--sunk);border:1px solid var(--hair);border-radius:2px;
  font:400 11.5px/1.55 var(--mono);white-space:pre-wrap;max-height:260px;overflow:auto;word-break:break-all}
.editor{width:100%;min-height:320px;background:var(--sunk);border:1px solid var(--rule);border-radius:2px;padding:12px;
  font:400 12.5px/1.65 var(--mono);resize:vertical;color:var(--ink)}
.filetree{list-style:none;margin:0;padding:0;max-height:60vh;overflow-y:auto}
.filetree li{padding:7px 0;border-bottom:1px solid var(--hair)}
.filetree button{background:none;border:0;text-align:left;cursor:pointer;width:100%;padding:0}
.filetree button:hover .fn{text-decoration:underline}
.filetree .fn{font:400 14px/1.35 var(--serif);display:block}
.filetree .fd{font:300 italic 12.5px/1.45 var(--serif);color:var(--ink-2);display:block;margin-top:2px}
.filetree .fm{font:400 10.5px/1.4 var(--mono);color:var(--ink-3);display:block;margin-top:2px}
.filetree li[aria-current="true"]{background:var(--bed);padding-left:8px;margin-left:-8px}
.wikilink{border-bottom:1px dotted var(--rule);cursor:pointer;background:none;padding:0;font:inherit;color:inherit}

/* ============================================================ the mascot */
.mascotwrap{position:relative;display:flex;justify-content:center;padding:2px 0 6px}
.mascot-mount{min-height:44px;display:flex;align-items:flex-end;justify-content:center}
.mascot-mount canvas{display:block;image-rendering:pixelated}
.mascot-mount button{background:none;border:0;padding:0;cursor:pointer;line-height:0;border-radius:3px}
.mascot-mount:not([data-live]){min-height:0}
.bubble{
  position:absolute;left:50%;bottom:calc(100% + 6px);transform:translateX(-50%);
  width:max-content;max-width:min(260px,86vw);z-index:45;
  background:var(--panel);border:1px solid var(--ink);border-radius:3px;padding:9px 11px;box-shadow:var(--shadow);
  font:300 13px/1.5 var(--serif);color:var(--ink)
}
.bubble::after{content:"";position:absolute;left:50%;top:100%;margin-left:-5px;border:5px solid transparent;border-top-color:var(--ink)}
.bubble b{font-family:var(--mono);font-weight:500;font-size:.92em}
.bubble a{border-bottom:1px solid var(--rule)}
.bubble .bq{display:block;margin-top:5px;font:300 italic 11.5px/1.4 var(--serif);color:var(--ink-3)}
.emptyart{display:flex;gap:14px;align-items:flex-start;padding:40px 12px;max-width:46ch}
.emptyart canvas{image-rendering:pixelated;flex:none;margin-top:2px}
.emptyart p{margin:0;font:300 italic 15px/1.6 var(--serif);color:var(--ink-3)}
@media (max-width:620px){
  .mascotwrap{padding:0 4px;align-items:center}
  .bubble{left:auto;right:0;transform:none}
  .bubble::after{left:auto;right:16px}
}

/* ============================================================ command palette */
#palette{border:1px solid var(--ink);background:var(--panel);color:var(--ink);border-radius:3px;padding:0;
  width:min(620px,94vw);max-height:70vh;box-shadow:var(--shadow);overflow:hidden}
#palette::backdrop{background:rgba(16,14,10,.45)}
#palette .pq{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--rule)}
#palette input{flex:1;background:none;border:0;font:300 18px/1.4 var(--serif);min-width:0}
#palette input:focus{outline:0}
#palette input::placeholder{color:var(--ink-3);font-style:italic}
#palette .phint{font:400 10.5px/1 var(--mono);color:var(--ink-3)}
#palette ul{list-style:none;margin:0;padding:6px 0;max-height:52vh;overflow-y:auto}
#palette li{padding:8px 18px;cursor:pointer;display:flex;gap:12px;align-items:baseline}
#palette li[aria-selected="true"]{background:var(--bed)}
#palette li .pk{font:300 italic 11.5px/1.4 var(--serif);color:var(--ink-3);width:74px;flex:none}
#palette li .pt{flex:1;min-width:0;font:400 14.5px/1.4 var(--serif);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#palette li .ps{font:400 11px/1.4 var(--mono);color:var(--ink-3);flex:none}
#palette .pempty{padding:22px 18px;font:300 italic 14px/1.5 var(--serif);color:var(--ink-3)}

/* ============================================================ responsive */
@media (max-width:1100px){
  :root{--rail:66px}
  .rail a.nav span.lbl,.mark b,.mark span,.railgroup,.railfoot small,.rail a.nav em{display:none}
  .rail a.nav{justify-content:center;padding:11px 0}
  .mark{justify-content:center;padding:0 0 18px}
  .railfoot{padding:14px 8px 0;align-items:center}
  .ghostbtn{padding:6px 8px}
  .ledger{grid-template-columns:minmax(0,1fr)}
  .listcol{border-right:0}
  .tools,.rows{padding-right:0}
  .sheetcol{position:fixed;inset:0;z-index:50;background:var(--film);overflow-y:auto;display:none}
  .sheetcol[data-open="1"]{display:block}
  .sheet{position:static;max-height:none;padding:18px clamp(16px,4vw,28px) 60px}
  .today{grid-template-columns:minmax(0,1fr);gap:0}
}
@media (max-width:620px){
  :root{--rail:0px}
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;width:100%;flex-direction:row;
    border-right:0;border-top:1px solid var(--rule);padding:0;z-index:40;align-items:stretch;overflow-x:auto}
  .mark,.railgroup{display:none}
  #navlinks{flex-direction:row;flex:1;overflow-x:auto}
  .rail a.nav{flex:1 1 auto;flex-direction:column;gap:3px;padding:8px 6px 7px;font-size:11px;min-width:58px}
  .rail a.nav span.lbl{display:block;font:400 10.5px/1 var(--serif)}
  .rail a.nav[aria-current="page"]::before{left:10%;right:10%;width:auto;top:0;bottom:auto;height:2px}
  .railfoot{margin:0;border-top:0;border-left:1px solid var(--hair);flex-direction:row;padding:0 6px;align-items:center}
  main{padding-bottom:78px}
  .masthead{padding:20px 0 14px}
  .masthead h1{font-size:27px}
  .readout{font-size:14px;line-height:1.55;margin-top:9px}
  .stamp{font-size:11.5px}
  .corehead{display:block}
  .corehead h2{margin-bottom:4px}
  .corehead p{font-size:12.5px;line-height:1.45}
  .viewhead p{font-size:13.5px}
  .cols,.cols3{grid-template-columns:minmax(0,1fr);gap:0}
  .grid thead{display:none}
  .grid tr{display:block;border-bottom:1px solid var(--rule);padding:10px 0}
  .grid td{display:block;border:0;padding:2px 0}
  .grid td[data-l]::before{content:attr(data-l) "  ";font:300 italic 12px/1.4 var(--serif);color:var(--ink-3)}
  .grid .said{max-width:none}
  .strip .unit{border-right:0;margin-right:12px;padding-right:0}
  .heat{grid-template-columns:auto repeat(12,minmax(0,1fr))}
  .register thead{display:none}
  .register tr{display:block;border-bottom:1px solid var(--rule);padding:12px 0}
  .register td{display:block;border:0;padding:2px 0}
  .register td[data-l]::before{content:attr(data-l) "  ";font:300 italic 12px/1.4 var(--serif);color:var(--ink-3)}
  .register .who{padding-top:6px}
  .register .said{max-width:none}
  .inline2{grid-template-columns:1fr}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:0.001ms !important;transition-duration:0.001ms !important}
}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to the ledger</a>
<div class="shell">

<nav class="rail" aria-label="Command centre modules">
  <div class="mark">
    <svg width="20" height="26" viewBox="0 0 20 26" aria-hidden="true">
      <rect x="1" y="1" width="18" height="24" rx="1" fill="none" stroke="currentColor" stroke-width="1.1"/>
      <path d="M1 7h18M1 12.5h18M1 18h18" stroke="currentColor" stroke-width=".7" opacity=".55"/>
      <circle cx="6.5" cy="4.2" r="1.5" fill="currentColor"/><circle cx="13" cy="9.6" r="1.1" fill="currentColor"/>
      <circle cx="8" cy="15.4" r="1.6" fill="currentColor"/>
      <circle cx="14" cy="21.2" r="2" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="1.6 1.4"/>
    </svg>
    <span><b>Command Center</b><span>the record of what this Mac has built</span></span>
  </div>
  <div class="railgroup">Working</div>
  <div id="navlinks"></div>
  <div class="railfoot">
    <div class="mascotwrap" id="mascotwrap"><div id="mascot-mount" class="mascot-mount"></div></div>
    <button class="ghostbtn" id="themebtn" type="button" aria-pressed="false">
      <svg width="13" height="13" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="3.4" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M7 .6v2M7 11.4v2M.6 7h2M11.4 7h2M2.5 2.5l1.4 1.4M10.1 10.1l1.4 1.4M11.5 2.5l-1.4 1.4M3.9 10.1l-1.4 1.4" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></svg>
      <span class="lbl" id="themelbl">Dark</span>
    </button>
    <small id="dbline">reading the ledger&hellip;</small>
  </div>
</nav>

<main id="main">
  <div class="wrap">
    <header class="masthead">
      <h1 id="viewtitle">The build ledger</h1>
      <p class="readout" id="readout" aria-live="polite">Reading the ledger&hellip;</p>
      <p class="stamp" id="stamp"></p>
    </header>
    <div id="viewroot"></div>
  </div>
</main>
</div>

<!-- ---------- view templates ---------- -->
<template id="tpl-ledger">
  <section class="corewrap" aria-labelledby="core-h">
    <div class="corehead">
      <h2 id="core-h">Core log</h2>
      <p>Time runs left to right, one bed per project. Each mineral grain is a thing that was built; hollow rings are
         sessions that built something and never wrote it down. Drag across the log to read one stretch of time.</p>
    </div>
    <div class="corestage">
      <canvas id="corelog" role="img" tabindex="0"
        aria-label="Core log: a stratigraphic chart of everything built, one bed per project across time. The same data is available as a table below."></canvas>
      <div class="tip" id="tip" role="status" aria-live="off"></div>
    </div>
    <div class="legend" id="legend" role="group" aria-label="Filter the ledger by kind of thing built"></div>
    <details class="alt">
      <summary>Read the core log as a table</summary>
      <div class="alttable"><table id="alttable"><caption class="sr">Every entry in the core log with its date, project, kind and file count</caption></table></div>
    </details>
  </section>

  <section class="ledger" aria-label="Ledger">
    <div class="listcol">
      <div class="tools">
        <div class="searchrow">
          <svg width="15" height="15" viewBox="0 0 15 15" aria-hidden="true"><circle cx="6.4" cy="6.4" r="4.6" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M9.9 9.9l3.6 3.6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          <label class="sr" for="q">Search the ledger</label>
          <input id="q" type="search" placeholder="Search titles, summaries, paths and tags" autocomplete="off" spellcheck="false">
          <kbd>/</kbd>
        </div>
        <div class="filters" id="filters"></div>
        <div class="countline"><span id="countline"></span><span id="brushnote" class="brushnote"></span></div>
      </div>
      <ul class="rows" id="rows" role="listbox" tabindex="0" aria-label="Ledger entries"></ul>
    </div>
    <div class="sheetcol" id="sheetcol"><div class="sheet" id="sheet"></div></div>
  </section>
</template>

<template id="tpl-audit">
  <div class="viewhead">
    <h2 class="sr">The audit register</h2>
    <p id="auditlede">Sessions that changed files and never logged what they were, sessions that pushed past the stop gate,
       and sessions waived on the record. Each row is a piece of work whose reason for existing is not written down anywhere.</p>
  </div>
  <div class="gapstage">
    <canvas id="gapstrip" role="img" aria-label="A strip of the last month showing, by day, which sessions left a record and which did not."></canvas>
  </div>
  <div class="filters" id="auditfilters" style="margin-top:12px"></div>
  <table class="register" id="register">
    <caption id="registercap">Every session missing from the record, newest first.</caption>
  </table>
</template>


<dialog id="confirm">
  <h3 id="confirm-h">Are you sure?</h3>
  <p id="confirm-p"></p>
  <div class="field" id="confirm-field" hidden>
    <label for="confirm-input"><span id="confirm-label">Reason</span></label>
    <textarea id="confirm-input" rows="3"></textarea>
    <span class="hint" id="confirm-hint"></span>
  </div>
  <div class="actions">
    <button class="btn primary" id="confirm-ok" type="button">Confirm</button>
    <button class="btn" id="confirm-cancel" type="button">Cancel</button>
  </div>
</dialog>

<dialog id="palette" aria-label="Command palette">
  <div class="pq">
    <svg width="15" height="15" viewBox="0 0 15 15" aria-hidden="true"><circle cx="6.4" cy="6.4" r="4.6" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M9.9 9.9l3.6 3.6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
    <label class="sr" for="pinput">Jump to anything or run an action</label>
    <input id="pinput" type="text" placeholder="Jump to anything, or type an action" autocomplete="off" spellcheck="false"
           role="combobox" aria-expanded="true" aria-controls="plist" aria-autocomplete="list">
    <span class="phint">esc</span>
  </div>
  <ul id="plist" role="listbox" aria-label="Results"></ul>
</dialog>

<div id="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
/* =====================================================================
   AI Command Center — single-file app.
   Module 1 (the build ledger) is implemented; later modules register
   themselves in VIEWS and appear in the rail with no other change.
   ===================================================================== */

/* ---------------------------------------------------------- small helpers */
const $  = (s, r) => (r || document).querySelector(s);

/* ---------------------------------------------------------- api */
const API = {
  async req(path, opts) {
    let res;
    try { res = await fetch(path, opts); }
    catch (e) { throw new Error("The tracker server is not answering. Start it with: python3 server.py"); }
    const text = await res.text();
    let body = null;
    try { body = text ? JSON.parse(text) : null; } catch (e) { body = { error: text.slice(0, 200) }; }
    if (!res.ok) { const err = new Error((body && body.error) || ("HTTP " + res.status)); err.status = res.status; err.body = body; throw err; }
    return body;
  },
  /* Several panels (the status strip, the mascot's feeds, the view itself) legitimately want the
     same GET at the same moment on a cold load — /api/usage/limits was fetched three times and
     /api/live/sessions twice. Two levels of coalescing:
       - always: an identical GET already in flight is shared, never re-issued;
       - additionally, for the read-only monitor feeds below, a settled answer is reused for 2 s.
     Nothing that a POST can change is cached, so no view can read its own stale state. */
  _inflight: new Map(),
  _monitor: /^\/api\/(stats|usage\/(limits|bundle|summary|series|analysis|models)|system|live\/sessions)\b/,
  get(path, ttl) {
    const hold = ttl !== undefined ? ttl : (API._monitor.test(path) ? 2000 : 0);
    const hit = API._inflight.get(path);
    if (hit && (!hit.done || (hold > 0 && Date.now() - hit.done < hold))) return hit.p;
    const rec = { p: null, done: 0 };
    rec.p = API.req(path);
    API._inflight.set(path, rec);
    rec.p.then(() => { rec.done = Date.now(); if (hold <= 0) API._inflight.delete(path); },
               () => API._inflight.delete(path));
    return rec.p;
  },
  fresh(path) { API._inflight.delete(path); return API.req(path); },
  post(path, body) { return API.req(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) }); },
  del(path) { return API.req(path, { method: "DELETE", headers: { "Content-Type": "application/json" } }); }
};

    $("#confirm-ok").className = "btn primary" + (opts.danger ? " danger" : "");
    const field = $("#confirm-field"), input = $("#confirm-input"), hint = $("#confirm-hint");
    field.hidden = !opts.input;

    const lines = block.split("\n");
    const isList = lines.every(l => /^\s*([-*•]|\d+[.)])\s+/.test(l) || !l.trim());
    if (isList && lines.some(l => l.trim())) {
      const ul = el("ul");

}

    if (m.index > last) node.appendChild(document.createTextNode(str.slice(last, m.index)));

    else node.appendChild(el("strong", { text: m[2].slice(2, -2) }));
    last = re.lastIndex;

}

/* =====================================================================
   THE CORE LOG — the centrepiece.
   A month of sessions read as sediment: one bed per project, thickening
   where the work piled up; every logged item is a mineral grain whose
   shape is its kind and whose size is the files and money it took; every
   session that built something and never logged it is a hollow vug.
   ===================================================================== */
const Core = {
  cv: null, ctx: null, box: null, W: 0, H: 0, dpr: 1,
  items: [], vugs: [], lanes: [], t0: 0, t1: 0,
  glyphs: [], marks: [], hover: null, focusIdx: -1, dimSet: null,
  prog: 0, raf: 0, t: 0, brush: null, dragging: null, live: null,

  mount(box) {

    this.cv.addEventListener("mouseleave", () => { this.hover = null; this.tip(null); this.paint(); });
    this.cv.addEventListener("mousedown", e => this.down(e));
    window.addEventListener("mouseup", e => this.up(e));
    this.cv.addEventListener("click", e => this.click(e));
    this.cv.addEventListener("keydown", e => this.key(e));
    this.cv.addEventListener("blur", () => { this.focusIdx = -1; this.tip(null); this.paint(); });

    this.ro.observe(box);
    window.__redraw = () => this.paint();
  },

  setData(items, vugSessions) {
    this.items = items.slice();
    this.vugs = vugSessions.slice();
    const all = [];
    items.forEach(i => { const t = d(i.built_at || i.created_at); if (t) all.push(+t); });
    this.vugs.forEach(s => { const t = d(s.started_at || s.created_at); if (t) all.push(+t); });
    const now = Date.now();
    this.t0 = all.length ? Math.min.apply(null, all) : now - 2592e6;
    this.t1 = Math.max(now, all.length ? Math.max.apply(null, all) : now);
    const pad = Math.max((this.t1 - this.t0) * 0.02, 432e5);
    this.t0 -= pad; this.t1 += pad * 0.6;

    const byProj = {};
    const bump = (p, w) => { const k = p || "elsewhere"; (byProj[k] = byProj[k] || { n: 0, w: 0 }).n++; byProj[k].w += w; };
    items.forEach(i => bump(i.project, 1));
    this.vugs.forEach(s => bump(s.project, 0.35));
    let names = Object.keys(byProj).sort((a, b) => byProj[b].w - byProj[a].w || a.localeCompare(b));
    const CAP = 12;
    let tail = [];
    if (names.length > CAP) { tail = names.slice(CAP - 1); names = names.slice(0, CAP - 1).concat(["elsewhere"]); }
    this.tail = tail;
    this.lanes = names.map((n, i) => ({ name: n, i: i, count: byProj[n] ? byProj[n].n : 0 }));
    if (tail.length) {
      const laneIdx = this.lanes.length - 1;
      this.lanes[laneIdx].count = tail.reduce((a, n) => a + byProj[n].n, 0);
      this.lanes[laneIdx].tail = tail;
    }
    this.laneOf = {};
    this.lanes.forEach(l => { this.laneOf[l.name] = l.i; });
    tail.forEach(n => { this.laneOf[n] = this.lanes.length - 1; });
    this.layout();
    this.prog = REDUCED.matches ? 1 : 0;
    this.animate();
  },

  setDim(set) { this.dimSet = set; this.paint(); },

  x(ts) { const p = this.PAD; return p.l + (ts - this.t0) / (this.t1 - this.t0) * (this.W - p.l - p.r); },
  tAt(px) { const p = this.PAD; return this.t0 + (px - p.l) / (this.W - p.l - p.r) * (this.t1 - this.t0); },

  layout() {
    if (!this.box || !this.lanes.length) return;
    const w = this.box.clientWidth || 900;
    const narrow = w < 640;
    this.compact = w < 600;
    this.PAD = { l: narrow ? (w < 600 ? 96 : 78) : 122, r: narrow ? 10 : 16, t: narrow ? 26 : 38, b: narrow ? 12 : 14 };
    const avail = Math.max(230, Math.min(430, (window.innerHeight || 900) * 0.45));
    this.laneH = this.compact ? 26 : narrow ? 30 : Math.max(34, Math.min(56, (avail - this.PAD.t - this.PAD.b) / this.lanes.length));
    this.W = w;
    this.H = this.PAD.t + this.lanes.length * this.laneH + this.PAD.b;
    this.dpr = Math.min(window.devicePixelRatio || 1, 2);
    this.cv.width = Math.round(this.W * this.dpr);
    this.cv.height = Math.round(this.H * this.dpr);

  /* per-lane activity density, smoothed — this is what makes the beds swell */
  buildGeometry() {
    const p = this.PAD, innerW = Math.max(10, this.W - p.l - p.r);

    const sigma = Math.max(2.2, N / 42);
    const add = (lane, ts, w) => {
      if (lane === undefined || lane < 0) return;
      const c = (ts - this.t0) / (this.t1 - this.t0) * (N - 1);
      const lo = Math.max(0, Math.floor(c - sigma * 3)), hi = Math.min(N - 1, Math.ceil(c + sigma * 3));

      for (let k = lo; k <= hi; k++) { const dd = (k - c) / sigma; arr[k] += w * Math.exp(-0.5 * dd * dd); }
    };

    this.vugs.forEach(s => { const t = d(s.started_at || s.created_at); if (t) add(this.laneOf[s.project || "elsewhere"], +t, 0.5); });
    let peak = 0.0001;
    this.dens.forEach(a => { for (let k = 0; k < a.length; k++) if (a[k] > peak) peak = a[k]; });
    this.densPeak = peak;

    /* grains and vugs, with deterministic jitter so the picture is stable */
    const hash = s => { let h = 2166136261; for (let k = 0; k < s.length; k++) { h ^= s.charCodeAt(k); h = Math.imul(h, 16777619); } return (h >>> 0) / 4294967295; };

      const t = d(it.built_at || it.created_at); if (!t) return;
      const lane = this.laneOf[it.project || "elsewhere"]; if (lane === undefined) return;
      const j = hash("g" + it.id) * 2 - 1;
      const weight = (it.files_count || 0) + Math.min(6, (Number(it.cost_usd) || 0) / 2.2);
      const small = this.compact || this.narrow;
      const r = (small ? 2.2 : 3.4) + Math.min(1, Math.sqrt(weight) / 3.1) * (this.compact ? 2.2 : small ? 3.4 : 6.2);
      this.glyphs.push({ kind: "item", id: it.id, t: +t, lane: lane, j: j, r: r, it: it });
    });
    this.vugs.forEach(s => {
      const t = d(s.started_at || s.created_at); if (!t) return;
      const lane = this.laneOf[s.project || "elsewhere"]; if (lane === undefined) return;
      const j = hash("v" + s.session_id) * 2 - 1;
      const r = (this.compact ? 2.4 : this.narrow ? 2.8 : 3.6) +
        Math.min(1, Math.sqrt(s.files_count || 0) / 2.6) * (this.compact ? 1.8 : this.narrow ? 2.6 : 4.6);
      this.glyphs.push({ kind: "vug", id: s.session_id, t: +t, lane: lane, j: j, r: r, se: s });
    });
    /* pack the grains into the bed so a busy week reads as a swarm, not a blot */
    this.glyphs.sort((a, b) => a.t - b.t);
    const placed = {};
    const maxOff = this.laneH * (this.narrow ? 0.26 : 0.33);
    this.glyphs.forEach(g => {
      g.x = this.x(g.t);
      const cy = this.PAD.t + g.lane * this.laneH + this.laneH / 2;
      const arr = placed[g.lane] || (placed[g.lane] = []);
      const stepY = Math.max(2.6, g.r * 1.35);
      let y = null;
      for (let k = 0; k < 26 && y === null; k++) {
        const off = (k % 2 ? -1 : 1) * Math.ceil(k / 2) * stepY + g.j * 1.6;
        if (Math.abs(off) > maxOff) continue;
        const cand = cy + off;
        let free = true;
        for (let m = arr.length - 1; m >= 0; m--) {
          const o = arr[m];
          if (g.x - o.x > 46) break;
          const dx = g.x - o.x, dy = cand - o.y, lim = (g.r + o.r) * 0.94;
          if (dx * dx + dy * dy < lim * lim) { free = false; break; }
        }
        if (free) y = cand;
      }
      g.y = y === null ? cy + g.j * maxOff : y;
      arr.push(g);
    });
  },

  animate() {
    cancelAnimationFrame(this.raf);
    const step = now => {
      this.t = now / 1000;
      if (this.prog < 1) this.prog = Math.min(1, this.prog + 0.022);
      this.paint();
      if (this.prog < 1 || (!REDUCED.matches && document.visibilityState === "visible" && this.onScreen())) this.raf = requestAnimationFrame(step);
    };
    this.raf = requestAnimationFrame(step);
  },
  onScreen() {
    if (!this.box) return false;
    const r = this.box.getBoundingClientRect();
    return r.bottom > 0 && r.top < window.innerHeight;
  },

  paint() {
    if (!this.ctx || !this.lanes.length) return;
    const c = this.ctx, p = this.PAD;
    c.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    c.clearRect(0, 0, this.W, this.H);
    const bg = cssvar("--bed"), bedFill = cssvar("--bedfill") || cssvar("--panel"), hair = cssvar("--hair"),
          rule = cssvar("--rule"), ink = cssvar("--ink"), ink2 = cssvar("--ink-2"), ink3 = cssvar("--ink-3"), vug = cssvar("--vug");
    c.fillStyle = bg; c.fillRect(0, 0, this.W, this.H);
    this.drawRuler(c, rule, ink3, hair);
    this.lanes.forEach(l => this.drawBed(c, l, bedFill, hair, rule, ink2, ink3));
    if (this.brush) {
      const x0 = this.x(this.brush[0]), x1 = this.x(this.brush[1]);
      c.save(); c.fillStyle = ink; c.globalAlpha = 0.07;
      c.fillRect(Math.min(x0, x1), p.t - 8, Math.abs(x1 - x0), this.H - p.t - p.b + 8);
      c.globalAlpha = 1; c.strokeStyle = ink; c.lineWidth = 1; c.setLineDash([3, 3]);
      c.beginPath(); c.moveTo(x0, p.t - 8); c.lineTo(x0, this.H - p.b); c.moveTo(x1, p.t - 8); c.lineTo(x1, this.H - p.b); c.stroke();
      c.restore();
    }
    this.glyphs.forEach((g, idx) => {
      const appear = this.prog >= 1 ? 1 : Math.max(0, Math.min(1, (this.prog * 1.3 - (g.x / this.W) * 0.3) * 2.4));
      if (appear <= 0) return;
      const dim = this.dimSet && g.kind === "item" && !this.dimSet.has(g.id);
      const hot = (this.hover && this.hover.id === g.id && this.hover.kind === g.kind) || (this.focusIdx === idx);
      if (g.kind === "item") this.drawGrain(c, g, appear, dim, hot, ink);
      else this.drawVug(c, g, appear, hot, vug);
    });
    /* the present, and the edge of the record */
    const nx = this.x(Date.now());
    c.save();
    c.strokeStyle = vug; c.lineWidth = 1;
    c.globalAlpha = REDUCED.matches ? 0.55 : 0.4 + 0.25 * (0.5 + 0.5 * Math.sin(this.t * 1.9));
    c.beginPath(); c.moveTo(nx, p.t - 10); c.lineTo(nx, this.H - p.b); c.stroke();
    c.globalAlpha = 1; c.fillStyle = vug;
    c.beginPath(); c.arc(nx, p.t - 10, 2.1, 0, 6.2832); c.fill();
    c.restore();
  },

  drawRuler(c, rule, ink3, hair) {
    const p = this.PAD, y = p.t - 10;
    c.save();
    c.strokeStyle = rule; c.lineWidth = 1;
    c.beginPath(); c.moveTo(p.l, y + 0.5); c.lineTo(this.W - p.r, y + 0.5); c.stroke();
    const dayPx = (this.W - p.l - p.r) / ((this.t1 - this.t0) / 864e5);
    const start = new Date(this.t0); start.setHours(0, 0, 0, 0);
    c.fillStyle = ink3;
    c.font = '400 10px ' + JSON.stringify(cssvar("--mono") || "monospace").slice(1, -1);
    c.textBaseline = "alphabetic";
    for (let t = +start; t <= this.t1; t += 864e5) {
      const x = this.x(t); if (x < p.l - 1) continue;
      const dt = new Date(t), dow = dt.getDay(), dom = dt.getDate();
      const week = dow === 1, month = dom === 1;
      if (dayPx > 5 || week) {
        c.strokeStyle = month ? rule : hair;
        c.beginPath(); c.moveTo(x + 0.5, y); c.lineTo(x + 0.5, y - (month ? 7 : week ? 5 : 3)); c.stroke();
      }
      if (month) {
        c.strokeStyle = hair; c.beginPath(); c.moveTo(x + 0.5, p.t); c.lineTo(x + 0.5, this.H - p.b); c.stroke();
      }
      const labelEvery = dayPx > 26 ? 1 : dayPx > 9 ? 7 : 14;
      const show = labelEvery === 1 ? true : (labelEvery === 7 ? week : week && dom <= 14);
      if (show && !this.narrow) {
        c.fillStyle = ink3; c.fillText(String(dom), x + 2, y - 4);
      }
      if (month) {
        c.fillStyle = cssvar("--ink-2");
        c.font = '400 ' + (this.narrow ? 9.5 : 11) + 'px ' + (cssvar("--serif") || "serif");
        c.fillText(this.narrow ? MONTHS[dt.getMonth()].slice(0, 3) : MONTHS[dt.getMonth()], x + 2, this.narrow ? y - 4 : y - 15);
        c.font = '400 10px ' + (cssvar("--mono") || "monospace");
      }
    }
    c.restore();
  },

  drawBed(c, lane, fill, hair, rule, ink2, ink3) {
    const p = this.PAD, N = this.dens[lane.i].length, arr = this.dens[lane.i];
    const cy = p.t + lane.i * this.laneH + this.laneH / 2;
    const half = this.laneH * 0.455;
    const seed = lane.i * 7.31 + 1.7;
    const yTop = xi => {
      const v = Math.min(1, arr[xi] / this.densPeak);
      const px = p.l + xi / (N - 1) * (this.W - p.l - p.r);
      const wob = Math.sin(px * 0.021 + seed) * 1.5 + Math.sin(px * 0.0071 + seed * 2.1) * 1.1;
      return cy - half * (0.2 + 0.8 * Math.pow(v, 0.55)) + wob * 0.5;
    };
    const yBot = xi => {
      const v = Math.min(1, arr[xi] / this.densPeak);
      const px = p.l + xi / (N - 1) * (this.W - p.l - p.r);
      const wob = Math.sin(px * 0.017 + seed * 1.6) * 1.4 + Math.sin(px * 0.0063 + seed) * 1.2;
      return cy + half * (0.2 + 0.8 * Math.pow(v, 0.55)) + wob * 0.5;
    };
    c.save();
    if (this.compact) {
      /* a phone gets a strip, not a bed: one rule per project with its count in the gutter */
      const band = 7;
      c.fillStyle = fill; c.fillRect(p.l, cy - band / 2, this.W - p.l - p.r, band);
      c.strokeStyle = rule; c.lineWidth = 1;
      c.strokeRect(p.l + .5, cy - band / 2 + .5, this.W - p.l - p.r - 1, band - 1);
      c.fillStyle = cssvar("--ink"); c.font = '400 9.5px ' + (cssvar("--mono") || "monospace");
      c.textBaseline = "middle"; c.textAlign = "right";
      let nm2 = lane.name;
      const room2 = p.l - 26;
      while (nm2.length > 3 && c.measureText(nm2).width > room2) nm2 = nm2.slice(0, -1);
      if (nm2 !== lane.name) nm2 = nm2.slice(0, -1) + "\u2026";
      c.fillText(nm2, p.l - 20, cy);
      c.fillStyle = ink3;
      c.fillText(String(lane.count), p.l - 4, cy);
      c.textAlign = "left";
      c.restore();
      return;
    }
    c.beginPath();
    for (let k = 0; k < N; k++) { const px = p.l + k / (N - 1) * (this.W - p.l - p.r); k ? c.lineTo(px, yTop(k)) : c.moveTo(px, yTop(k)); }
    for (let k = N - 1; k >= 0; k--) { const px = p.l + k / (N - 1) * (this.W - p.l - p.r); c.lineTo(px, yBot(k)); }
    c.closePath();
    c.fillStyle = fill; c.globalAlpha = lane.i % 2 ? 0.92 : 1; c.fill(); c.globalAlpha = 1;
    c.save(); c.clip();
    /* bedding laminae */
    c.strokeStyle = rule; c.globalAlpha = 0.5; c.lineWidth = 0.7;
    for (let b = -2; b <= 2; b++) {
      c.beginPath();
      for (let k = 0; k < N; k += 2) {
        const px = p.l + k / (N - 1) * (this.W - p.l - p.r);
        const t = yTop(k), bm = yBot(k);
        const yy = t + (bm - t) * ((b + 2.5) / 5);
        k ? c.lineTo(px, yy) : c.moveTo(px, yy);
      }
      c.stroke();
    }
    c.globalAlpha = 1;
    /* stipple — denser where the work piled up */
    c.fillStyle = ink3; c.globalAlpha = 0.42;
    let sr = (lane.i + 3) * 9781;
    const rnd = () => { sr = (sr * 1103515245 + 12345) & 0x7fffffff; return sr / 0x7fffffff; };
    const dots = Math.round((this.W - p.l - p.r) / (this.narrow ? 7 : 4.2));
    for (let k = 0; k < dots; k++) {
      const u = rnd(), xi = Math.floor(u * (N - 1));
      const v = Math.min(1, arr[xi] / this.densPeak);
      if (rnd() > 0.18 + v * 0.82) continue;
      const px = p.l + u * (this.W - p.l - p.r);
      const py = yTop(xi) + rnd() * (yBot(xi) - yTop(xi));
      c.fillRect(px, py, 1.05, 1.05);
    }
    c.globalAlpha = 1;
    c.restore();
    c.strokeStyle = rule; c.lineWidth = 1; c.globalAlpha = 0.95; c.stroke(); c.globalAlpha = 1;

    if (this.narrow) {
      if (this.compact) { c.restore(); return; }
      c.fillStyle = cssvar("--ink"); c.font = '400 9.5px ' + (cssvar("--mono") || "monospace");
      c.textBaseline = "middle"; c.textAlign = "right";
      let nm = lane.name;
      while (nm.length > 3 && c.measureText(nm).width > p.l - 10) nm = nm.slice(0, -1);
      if (nm !== lane.name) nm = nm.slice(0, -1) + "…";
      c.fillText(nm, p.l - 6, cy);
      c.textAlign = "left";
    } else {
      c.fillStyle = cssvar("--ink"); c.textAlign = "right"; c.textBaseline = "middle";
      c.font = '400 12.5px ' + (cssvar("--serif") || "serif");
      const room = p.l - 20;
      let name = lane.name;
      while (name.length > 4 && c.measureText(name).width > room) name = name.slice(0, -1);
      if (name !== lane.name) name = name.slice(0, -1) + "…";
      c.fillText(name, p.l - 12, cy - 5);
      c.fillStyle = ink3; c.font = '400 10px ' + (cssvar("--mono") || "monospace");
      c.fillText(lane.count + (lane.tail ? " in " + lane.tail.length : ""), p.l - 12, cy + 8);
      c.textAlign = "left";
      c.strokeStyle = hair; c.beginPath(); c.moveTo(p.l - 7, cy); c.lineTo(p.l - 2, cy); c.stroke();
    }
    c.restore();
  },

  drawGrain(c, g, appear, dim, hot, ink) {
    const it = g.it, col = kindColor(it.kind);
    const r = g.r * (0.55 + 0.45 * appear) * (hot ? 1.35 : 1);
    const faded = it.status === "abandoned" || it.status === "superseded";
    c.save();
    c.translate(g.x, g.y);
    c.globalAlpha = (dim ? 0.16 : faded ? 0.45 : 1) * (0.35 + 0.65 * appear);
    c.strokeStyle = col; c.fillStyle = col; c.lineWidth = Math.max(0.9, r * 0.22);
    c.lineJoin = "round";
    const inferred = it.confidence === "inferred";
    if (inferred) { c.setLineDash([r * 0.62, r * 0.5]); }
    this.shape(c, it.kind, r);
    if (inferred) { c.stroke(); } else { c.fill(); c.setLineDash([]); c.globalAlpha *= 0.55; c.strokeStyle = ink; c.lineWidth = 0.6; c.stroke(); }
    c.restore();
    if (hot) {
      c.save(); c.translate(g.x, g.y); c.strokeStyle = ink; c.lineWidth = 1; c.globalAlpha = 0.8;
      c.beginPath(); c.arc(0, 0, r + 4.5, 0, 6.2832); c.stroke(); c.restore();
    }
  },

  shape(c, kind, r) {
    c.beginPath();
    switch (kind) {
      case "build": {                                   /* a crystal */
        const pts = [[0,-1.25],[0.86,-0.5],[0.86,0.55],[0,1.25],[-0.86,0.55],[-0.86,-0.5]];
        pts.forEach((p, i) => { const x = p[0]*r, y = p[1]*r; i ? c.lineTo(x, y) : c.moveTo(x, y); });
        c.closePath(); break; }
      case "enhancement": {                              /* accreted layers */
        c.moveTo(-r, r*0.55); c.lineTo(0, -r*0.35); c.lineTo(r, r*0.55);
        c.lineTo(r*0.55, r*0.85); c.lineTo(0, r*0.15); c.lineTo(-r*0.55, r*0.85); c.closePath(); break; }
      case "fix": {                                      /* a healed fracture */
        c.moveTo(-r, -r*0.85); c.lineTo(-r*0.2, -r*0.1); c.lineTo(r*0.2, r*0.1); c.lineTo(r, r*0.85);
        c.lineTo(r*0.5, r*1.05); c.lineTo(0, r*0.3); c.lineTo(-r*0.5, -r*0.5); c.closePath(); break; }
      case "research": c.arc(0, 0, r * 0.98, 0, 6.2832); break;             /* a nodule */
      case "doc": {                                      /* a leaf of paper */
        c.moveTo(-r*0.78, -r); c.lineTo(r*0.42, -r); c.lineTo(r*0.78, -r*0.5);
        c.lineTo(r*0.78, r); c.lineTo(-r*0.78, r); c.closePath(); break; }
      case "config": {                                   /* a cog */
        c.arc(0, 0, r * 0.66, 0, 6.2832);
        const tw = r * 0.34, th = r * 1.15;
        for (let k = 0; k < 4; k++) {
          const a = k * Math.PI / 2;
          const ca = Math.cos(a), sa = Math.sin(a);
          c.moveTo(ca * tw - sa * 0, sa * tw + ca * 0);
          c.moveTo(-sa * tw + ca * r * 0.4, ca * tw + sa * r * 0.4);
          c.lineTo(-sa * tw + ca * th, ca * tw + sa * th);
          c.lineTo(sa * tw + ca * th, -ca * tw + sa * th);
          c.lineTo(sa * tw + ca * r * 0.4, -ca * tw + sa * r * 0.4);
          c.closePath();
        }
        break; }
      case "automation": {                               /* a coil */
        c.arc(0, 0, r * 0.98, -0.4, 4.9); c.lineTo(0, 0); c.closePath(); break; }
      case "analysis": {                                 /* a shard */
        c.moveTo(0, -r*1.22); c.lineTo(r*1.06, r*0.72); c.lineTo(-r*1.06, r*0.72); c.closePath(); break; }
      default: c.arc(0, 0, r * 0.8, 0, 6.2832);
    }
  },

  drawVug(c, g, appear, hot, vugcol) {
    const s = g.se, r = g.r * (0.55 + 0.45 * appear) * (hot ? 1.3 : 1);
    c.save(); c.translate(g.x, g.y);
    c.globalAlpha = 0.35 + 0.65 * appear;
    c.strokeStyle = vugcol; c.lineWidth = 1.25; c.setLineDash([2.1, 1.9]);
    c.beginPath(); c.arc(0, 0, r, 0, 6.2832); c.stroke();
    if (s.state === "bypassed") {
      c.setLineDash([]); c.lineWidth = 0.9; c.globalAlpha *= 0.8;
      c.beginPath(); c.arc(0, 0, r * 0.52, 0, 6.2832); c.stroke();
    }
    c.restore();
    if (hot) { c.save(); c.translate(g.x, g.y); c.strokeStyle = cssvar("--ink"); c.lineWidth = 1; c.globalAlpha = .8;
      c.beginPath(); c.arc(0, 0, r + 4.5, 0, 6.2832); c.stroke(); c.restore(); }
  },

  /* ---------------- interaction ---------------- */
  at(e) {
    const b = this.cv.getBoundingClientRect();
    return { x: (e.clientX - b.left), y: (e.clientY - b.top) };
  },
  hit(x, y) {
    let best = null, bd = 1e9;
    for (const g of this.glyphs) {
      const dx = g.x - x, dy = g.y - y, dd = dx * dx + dy * dy;
      const lim = (g.r + 7) * (g.r + 7);
      if (dd < lim && dd < bd) { bd = dd; best = g; }
    }
    return best;
  },
  pointer(e) {
    const pt = this.at(e);
    if (this.dragging !== null) {
      this.brush = [this.tAt(Math.min(this.dragging, pt.x)), this.tAt(Math.max(this.dragging, pt.x))];
      this.paint(); return;
    }
    const g = this.hit(pt.x, pt.y);
    if ((g && (!this.hover || this.hover.id !== g.id)) || (!g && this.hover)) { this.hover = g; this.paint(); }
    this.cv.style.cursor = g ? "pointer" : (pt.y > this.PAD.t ? "ew-resize" : "default");
    this.tip(g, pt);
  },
  tip(g, pt) {
    const t = $("#tip"); if (!t) return;
    if (!g) { t.setAttribute("data-on", "0"); return; }
    clear(t);
    if (g.kind === "item") {
      const it = g.it;
      t.appendChild(el("b", { text: it.title }));
      t.appendChild(el("span", { class: "kindline", text: it.kind + " in " + (it.project || "—") + (it.confidence === "inferred" ? ", reconstructed afterwards" : "") }));
      t.appendChild(el("span", { text: fmtStamp(it.built_at || it.created_at) + ",  " + (it.files_count || 0) + " " + plural(it.files_count || 0, "file") + (it.cost_usd ? ",  " + money(it.cost_usd) : "") }));
    } else {
      const s = g.se;
      t.appendChild(el("b", { text: s.title || "Untitled session" }));
      t.appendChild(el("span", { class: "kindline", text: (s.state === "bypassed" ? "pushed past the stop gate" : "never logged") + " in " + (s.project || "—") }));
      t.appendChild(el("span", { text: fmtStamp(s.started_at) + ",  " + (s.files_count || 0) + " " + plural(s.files_count || 0, "file") + " changed" }));
    }
    t.setAttribute("data-on", "1");
    const bw = this.box.clientWidth;
    const tw = Math.min(300, t.offsetWidth || 240);
    let left = (pt ? pt.x : g.x) + 14;
    if (left + tw > bw - 6) left = (pt ? pt.x : g.x) - tw - 14;
    t.style.left = Math.max(6, left) + "px";
    t.style.top = Math.max(4, (pt ? pt.y : g.y) - 16) + "px";
  },
  down(e) { const pt = this.at(e); if (!this.hit(pt.x, pt.y)) { this.dragging = pt.x; this.dragStart = Date.now(); } },
  up(e) {
    if (this.dragging === null) return;
    const moved = this.brush && Math.abs(this.x(this.brush[1]) - this.x(this.brush[0])) > 8;
    this.dragging = null;
    if (!moved) { this.brush = null; this.paint(); Ledger.setRange(null); return; }
    Ledger.setRange(this.brush);
    this.paint();
  },
  clearBrush() { this.brush = null; this.paint(); },
  click(e) {
    const pt = this.at(e); const g = this.hit(pt.x, pt.y);
    if (!g) return;
    if (g.kind === "item") Ledger.open(g.id, true);
    else { location.hash = "#/audit/" + g.id; }
  },
  key(e) {
    if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
      e.preventDefault();
      const dir = e.key === "ArrowRight" ? 1 : -1;
      this.focusIdx = Math.max(0, Math.min(this.glyphs.length - 1, (this.focusIdx < 0 ? (dir > 0 ? -1 : this.glyphs.length) : this.focusIdx) + dir));
      const g = this.glyphs[this.focusIdx];
      if (g) {
        this.tip(g, { x: g.x, y: g.y });
        this.live.textContent = (g.kind === "item"
          ? g.it.title + ", " + g.it.kind + " in " + (g.it.project || "no project") + ", " + fmtLong(g.it.built_at || g.it.created_at)
          : "Unlogged session in " + (g.se.project || "no project") + ", " + fmtLong(g.se.started_at) + ", " + (g.se.files_count || 0) + " files changed");
        this.paint();
      }
    } else if (e.key === "Enter" && this.focusIdx >= 0) {
      e.preventDefault();
      const g = this.glyphs[this.focusIdx];
      if (g.kind === "item") Ledger.open(g.id, true); else location.hash = "#/audit/" + g.id;
    } else if (e.key === "Escape" && this.brush) { this.brush = null; Ledger.setRange(null); this.paint(); }
  },
  destroy() { cancelAnimationFrame(this.raf); if (this.ro) this.ro.disconnect(); window.__redraw = null; this.lanes = []; this.glyphs = []; }
};

/* =====================================================================
   THE LEDGER — list, filters, and the specimen sheet.
   ===================================================================== */
const Ledger = {
  root: null, rowsEl: null, allItems: [], vugs: [],

  async mount(root) {
    root.appendChild($("#tpl-ledger").content.cloneNode(true));
    this.root = root;
    this.rowsEl = $("#rows");
    Core.mount($(".corestage"));
    this.wire();
    this.renderFilters();
    this.renderLegend();
    await this.loadCanvas();
    await this.load();
    if (S.param) this.open(Number(S.param), false);
  },
  unmount() { Core.destroy(); this.root = null; },

  wire() {
    const q = $("#q");
    q.value = S.filters.q;
    q.addEventListener("input", debounce(() => { S.filters.q = q.value.trim(); S.selected = -1; this.load(); }, 200));
    q.addEventListener("keydown", e => { if (e.key === "Escape") { q.value = ""; S.filters.q = ""; this.load(); } });
    this.rowsEl.addEventListener("keydown", e => this.rowKeys(e));
  },

  renderFilters() {
    const host = clear($("#filters"));
    const projects = (S.stats && S.stats.projects || []).filter(p => p.items > 0);
    const g1 = el("div", { class: "fgroup", role: "group", "aria-label": "Filter by project" }, [el("span", { class: "flabel", text: "projects" })]);
    projects.slice(0, 14).forEach(p => {
      const on = S.filters.projects.indexOf(p.project) >= 0;
      g1.appendChild(el("button", {
        class: "chip", type: "button", "aria-pressed": String(on),
        onclick: () => { const i = S.filters.projects.indexOf(p.project); i >= 0 ? S.filters.projects.splice(i, 1) : S.filters.projects.push(p.project); this.renderFilters(); this.load(); }
      }, [document.createTextNode(p.project), el("span", { class: "ct", text: String(p.items) })]));
    });
    host.appendChild(g1);

    const g2 = el("div", { class: "fgroup" }, [el("span", { class: "flabel", text: "showing" })]);
    const conf = el("select", { class: "sel", "aria-label": "Filter by how the entry got here", onchange: e => { S.filters.confidence = e.target.value; this.load(); } });
    [["", "logged and reconstructed"], ["confirmed", "logged by the session"], ["inferred", "reconstructed afterwards"]]
      .forEach(o => conf.appendChild(el("option", { value: o[0], text: o[1], selected: S.filters.confidence === o[0] })));
    g2.appendChild(conf);
    const st = el("select", { class: "sel", "aria-label": "Filter by status", onchange: e => { S.filters.status = e.target.value; this.load(); } });
    [["", "every status"]].concat(STATUSES.map(s => [s, s])).forEach(o => st.appendChild(el("option", { value: o[0], text: o[1], selected: S.filters.status === o[0] })));

  renderRows() {

      });

        el("span", { class: "date", text: fmtStamp(it.built_at || it.created_at) }),
        el("span", { class: "flags", text: (it.files_count || 0) + " " + plural(it.files_count || 0, "file") + (it.links_count ? ", " + it.links_count + " " + plural(it.links_count, "link") : "") }),
      ]);
      if (it.confidence === "inferred") meta.appendChild(el("span", { class: "flags" }, [el("span", { class: "inf", text: "reconstructed" })]));
      if (it.status !== "active") meta.appendChild(el("span", { class: "flags", text: it.status }));

      const snip = el("div", { class: "snip" });
      if (it.snippet) {
        String(it.snippet).split(/(‹[^›]*›)/).forEach(part => {
          if (part.charAt(0) === "‹") snip.appendChild(el("mark", { text: part.slice(1, -1) }));
          else if (part) snip.appendChild(document.createTextNode(part));
        });
      } else snip.textContent = it.summary || "";

      host.appendChild(li);
    });
    if (S.items.length < S.total) {
      host.appendChild(el("li", { role: "presentation" }, [
        el("button", { class: "more", type: "button", text: "read the next " + Math.min(120, S.total - S.items.length) + " entries",
          onclick: () => { S.limit += 120; this.load(); } })]));
    }
    if (S.selected >= 0) this.rowsEl.setAttribute("aria-activedescendant", "row-" + (S.items[S.selected] || {}).id);
  },

  rowKeys(e) {
    if (!S.items.length) return;
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      S.selected = Math.max(0, Math.min(S.items.length - 1, (S.selected < 0 ? -1 : S.selected) + (e.key === "ArrowDown" ? 1 : -1)));
      this.markSelected(true);
    } else if (e.key === "Home") { e.preventDefault(); S.selected = 0; this.markSelected(true); }
    else if (e.key === "End") { e.preventDefault(); S.selected = S.items.length - 1; this.markSelected(true); }
    else if (e.key === "Enter" || e.key === " ") {
      if (S.selected >= 0) { e.preventDefault(); this.open(S.items[S.selected].id, true); }
    }
  },
  markSelected(scroll) {
    $$(".row", this.rowsEl).forEach((r, i) => r.setAttribute("aria-selected", String(i === S.selected)));
    const it = S.items[S.selected];
    if (!it) return;
    this.rowsEl.setAttribute("aria-activedescendant", "row-" + it.id);
    const node = $("#row-" + it.id);
    if (node && scroll) node.scrollIntoView({ block: "nearest" });
    this.open(it.id, false);
  },

  async open(id, focus) {
    const idx = S.items.findIndex(i => i.id === id);
    if (idx >= 0) { S.selected = idx; $$(".row", this.rowsEl).forEach((r, i) => r.setAttribute("aria-selected", String(i === idx))); }
    if (location.hash !== "#/ledger/" + id) history.replaceState(null, "", "#/ledger/" + id);
    S.editing = false;
    try {
      S.detail = await API.get("/api/items/" + id);
      this.renderSheet(S.detail);
      $("#sheetcol").setAttribute("data-open", "1");
      if (focus && window.matchMedia("(max-width:1100px)").matches) { const h = $(".sheethead h2"); if (h) h.focus(); }
    } catch (e) { toast(e.message); }
  },
  close() {
    S.detail = null; $("#sheetcol").removeAttribute("data-open");
    this.renderSheet(null);
    if (location.hash.indexOf("#/ledger/") === 0) history.replaceState(null, "", "#/ledger");
    const r = S.items[S.selected] && $("#row-" + S.items[S.selected].id);
    (r || this.rowsEl).focus();
  }
};

  editForm(det) {
    const it = det.item;
    const form = el("form", { class: "editform", onsubmit: e => { e.preventDefault(); this.save(it.id, form); } });

      const w = el("label", { class: "field" }, [el("span", { text: label })]);

      if (tag === "textarea") f.value = value || "";
      w.appendChild(f);
      return { w: w, f: f };
    };
    const title = mk("title", "title — the name of the thing, not the task", it.title, "input", { maxlength: "140", required: true });

    const upd = () => { const n = sum.f.value.trim().length; hint.textContent = n + " characters"; hint.className = "hint" + (n < 60 ? " bad" : ""); };
    sum.f.addEventListener("input", upd); upd();
    sum.w.appendChild(hint);
    form.appendChild(sum.w);
    form.appendChild(mk("usage", "how to run it and where it lives", it.usage || "", "textarea", { rows: "3" }).w);
    const two = el("div", { class: "inline2" });

    ]);

  async save(id, form) {
    const fd = new FormData(form);
    const body = {
      title: (fd.get("title") || "").trim(),
      summary: (fd.get("summary") || "").trim(),
      usage: (fd.get("usage") || "").trim(),
      kind: fd.get("kind"), status: fd.get("status"),

  async remove(it) {

    }
  },
  async refresh() {
    await loadStats();
    this.renderFilters(); this.renderLegend();
    await this.loadCanvas();
    await this.load();
  }
});

  /* the gap strip: one cell per session, stacked by day. Solid cells are days

  strip() {

    const box = $(".gapstage"); if (!box) return;
    const rowsOf = {}; let MAXROWS = 3;
    (this.all || this.sessions).forEach(s => {
      const t = d(s.started_at || s.created_at); if (!t) return;
      const k = new Date(t); k.setHours(0, 0, 0, 0);
      rowsOf[+k] = (rowsOf[+k] || 0) + 1;
      if (rowsOf[+k] > MAXROWS) MAXROWS = Math.min(9, rowsOf[+k]);
    });
    const CELL = 11, GAPY = 2, AXIS = 26, TOP = 20;
    const W = box.clientWidth, H = TOP + MAXROWS * (CELL + GAPY) + AXIS;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); cv.style.height = H + "px";
    const c = cv.getContext("2d");

          hair = cssvar("--hair"), vug = cssvar("--vug"), good = cssvar("--k-enhancement");

    const days = {};
    let lo = Infinity, hi = -Infinity;
    (this.all || this.sessions).forEach(s => {
      const t = d(s.started_at || s.created_at); if (!t) return;
      const k = new Date(t); k.setHours(0, 0, 0, 0);
      const key = +k;
      (days[key] = days[key] || []).push(s);
      if (key < lo) lo = key; if (key > hi) hi = key;
    });
    const today = new Date(); today.setHours(0, 0, 0, 0);
    if (!isFinite(lo)) { lo = +today - 2592e6; }
    hi = Math.max(hi, +today);
    const nDays = Math.round((hi - lo) / 864e5) + 1;
    const padL = 16, padR = 16;
    const step = (W - padL - padR) / Math.max(1, nDays);
    const cw = Math.max(2.5, Math.min(CELL, step - 1.6));
    const base = H - AXIS;

    c.strokeStyle = rule; c.lineWidth = 1;
    c.beginPath(); c.moveTo(padL, base + 0.5); c.lineTo(W - padR, base + 0.5); c.stroke();
    c.font = '400 10px ' + (cssvar("--mono") || "monospace");
    c.textBaseline = "alphabetic";
    for (let i = 0; i < nDays; i++) {
      const t = lo + i * 864e5, dt = new Date(t), x = padL + i * step;
      if (dt.getDay() === 1) {
        c.strokeStyle = hair; c.beginPath(); c.moveTo(x + .5, base); c.lineTo(x + .5, base + 5); c.stroke();
        if (step > 3.2 || dt.getDate() <= 7) { c.fillStyle = ink3; c.fillText(dt.getDate() + " " + MONTHS[dt.getMonth()].slice(0, 3), x + 2, base + 17); }
      }
      const list = days[t]; if (!list || !list.length) continue;
      const order = { bypassed: 0, unlogged: 1, waived: 2, logged: 3, quiet: 4 };
      list.sort((a, b) => (order[a.state] || 9) - (order[b.state] || 9));
      list.slice(0, MAXROWS).forEach((s, k) => {
        const y = base - (k + 1) * (cw + GAPY) + GAPY;
        c.save();
        if (s.state === "logged") { c.fillStyle = good; c.globalAlpha = .9; c.fillRect(x, y, cw, cw); }
        else if (s.state === "waived") {
          c.strokeStyle = ink3; c.lineWidth = 1; c.globalAlpha = .8;
          c.strokeRect(x + .5, y + .5, cw - 1, cw - 1);
          c.beginPath(); c.moveTo(x + 1.5, y + 1.5); c.lineTo(x + cw - 1.5, y + cw - 1.5); c.stroke();
        } else {
          c.strokeStyle = vug; c.lineWidth = 1.1; c.globalAlpha = .95; c.setLineDash([2, 1.6]);
          c.strokeRect(x + .55, y + .55, cw - 1.1, cw - 1.1);
          if (s.state === "bypassed") { c.setLineDash([]); c.fillStyle = vug; c.fillRect(x + cw / 2 - 1.1, y + cw / 2 - 1.1, 2.2, 2.2); }
        }
        c.restore();
      });
      if (list.length > MAXROWS && step > 7) {
        c.fillStyle = ink3; c.font = '400 8.5px ' + (cssvar("--mono") || "monospace");
        c.fillText("+" + (list.length - MAXROWS), x, base - MAXROWS * (cw + GAPY) - 2);
      }
    }
    c.fillStyle = cssvar("--ink-2"); c.font = '300 italic 11.5px ' + (cssvar("--serif") || "serif");
    c.textBaseline = "alphabetic";
    c.fillText(W < 620 ? "filled went on the record, dashed never did"
      : "every session of the last month, one square each, stacked by day: filled went on the record, dashed never did, crossed were waived", padL, 13);
  }
};

function stub(root, title, lines, cmd) {

  root.appendChild(box);

function notLoaded(root, name, file) {

    "The " + name + " view reads " + file + ", and the server has not mounted it. Nothing is broken — the module simply is not there yet.",
    "The server lists what it did mount, and why anything failed, at /api/modules."

}
function tok(n) {
  n = Number(n || 0);
  if (n >= 1e9) return (n / 1e9).toFixed(2) + " B";
  if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e8 ? 0 : 1) + " M";
  if (n >= 1e3) return (n / 1e3).toFixed(0) + " k";

}

}

  if (!isFinite(n) || n <= 0) return raw || "\u2014";
  const dd = Math.floor(n / 86400), h = Math.floor((n % 86400) / 3600), m = Math.floor((n % 3600) / 60);
  if (dd) return dd + "d " + h + "h";
  if (h) return h + "h " + String(m).padStart(2, "0") + "m";

}

  const t = d(iso); if (!t) return "—";
  const m = (Date.now() - t) / 60000;
  if (m < 1) return "just now";
  if (m < 60) return Math.round(m) + " min ago";
  if (m < 1440) return dur(m) + " ago";
  const dd = Math.round(m / 1440);
