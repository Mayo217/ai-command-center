}
const FAMILY_COLOR = { fable: "--k-build", opus: "--k-analysis", sonnet: "--k-research", haiku: "--k-automation", other: "--k-other" };

const Strip = {
  timer: null, data: {},
  mount(deferFirstLoad) {
    if ($("#strip")) return;
    $(".masthead").appendChild(el("div", { class: "strip", id: "strip", "aria-live": "polite",
      "aria-label": "Machine and plan-limit status" }));

    // for. On boot it loads once the routed view has painted.

  },
  async refresh() {
    const [lim, sys, live] = await Promise.all([
      modGet("/api/usage/limits").catch(() => null),
      modGet("/api/system").catch(() => null),
      modGet("/api/live/sessions").catch(() => null)

  unit(host, label, value, cls, href, extra) {

  },

    m.appendChild(el("i", { style: "width:" + Math.max(1, Math.min(100, pct)).toFixed(1) + "%" }));
    w.appendChild(m);
    w.appendChild(el("span", { class: "vl" + (pct >= 85 ? " warn" : ""), text: Math.round(pct) + "%" }));

      ]);

    this.renderBody();

    this.cv.addEventListener("mousemove", e => this.point(e));

    this.ro = new ResizeObserver(debounce(() => this.draw(), 90));

  unmount() { if (this.ro) this.ro.disconnect(); window.__redraw = null; },

  renderTools() {

        else { [sum, an] = await Promise.all([modGet("/api/usage/summary?days=" + n), modGet("/api/usage/analysis?days=" + n)]); }

      text: lim.sampled_at_ist ? "limits sampled " + ago(lim.sampled_at) + (lim.stale ? ", stale" : "") : "no limit sample yet" }));
  },

    const host = clear($("#ubody"));

    const t = sum.totals, cal = sum.calibration || {};

    if (an && an.by_hour_of_day) this.heat(host, an);
    if (an && an.cache_hit_ratio_trend && an.cache_hit_ratio_trend.length) {
      const last = an.cache_hit_ratio_trend[an.cache_hit_ratio_trend.length - 1];
      const avg = an.cache_hit_ratio_trend.reduce((a, r) => a + r.cache_hit_pct, 0) / an.cache_hit_ratio_trend.length;
      host.appendChild(el("p", { class: "note-line",
        text: "Cache hits average " + avg.toFixed(1) + "% across the window and sat at " + last.cache_hit_pct + "% on " + last.day + ". Every point of that is input tokens billed at the cache rate instead of the full one." }));
    }
    host.appendChild(el("p", { class: "note-line", text: sum.cost_basis || "" }));
  },

  /* ---- the instrument: burn bars, the sample history, the daily burn ---- */
  draw() {
    const cv = this.cv, box = cv && cv.parentElement; if (!cv || !box) return;
    const W = box.clientWidth, dpr = Math.min(window.devicePixelRatio || 1, 2);
    const narrow = W < 640;
    const R1 = narrow ? 96 : 84, R2 = 92, R3 = narrow ? 130 : 158;
    const H = R1 + R2 + R3 + 22;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); cv.style.height = H + "px";
    const c = cv.getContext("2d");
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    const ink = cssvar("--ink"), ink2 = cssvar("--ink-2"), ink3 = cssvar("--ink-3"),
          rule = cssvar("--rule"), hair = cssvar("--hair"), vug = cssvar("--vug"),
          good = cssvar("--k-enhancement"), warm = cssvar("--k-build");
    const SER = cssvar("--serif") || "serif", MON = cssvar("--mono") || "monospace";
    c.fillStyle = cssvar("--bed"); c.fillRect(0, 0, W, H);
    const padL = narrow ? 12 : 18, padR = narrow ? 12 : 18;
    this.geo = { W: W, H: H, padL: padL, padR: padR, R1: R1, R2: R2, R3: R3, narrow: narrow };

    /* --- register 1: the two windows, burning down --- */
    const lim = this.data.lim;
    const bars = [];
    if (lim && lim.current) {
      if (lim.current.five_hour) bars.push(["the 5-hour window", lim.current.five_hour]);
      if (lim.current.seven_day) bars.push(["the 7-day window", lim.current.seven_day]);
    }
    if (!bars.length) {
      c.fillStyle = ink2; c.font = '300 italic 14px ' + SER;
      c.textBaseline = "middle";
      c.fillText(lim ? "No limit sample yet — this opens as soon as any Claude Code session refreshes its status line."
                     : "The usage module is not loaded, so plan limits are unavailable.", padL, R1 / 2);
      c.strokeStyle = hair; c.beginPath(); c.moveTo(padL, R1 - 0.5); c.lineTo(W - padR, R1 - 0.5); c.stroke();
    } else {
      bars.forEach((b, i) => {
        const label = b[0], v = b[1];
        const y = 26 + i * 40;
        const pct = Math.max(0, Math.min(100, Number(v.used_pct) || 0));
        const col = pct >= 85 ? vug : pct >= 60 ? warm : good;
        c.textBaseline = "alphabetic";
        c.fillStyle = ink2; c.font = '300 italic 12.5px ' + SER;
        c.fillText(label, padL, y - 6);
        const rightTxt = v.resets_at_ist ? "resets " + String(v.resets_at_ist).slice(11).trim() + ", in " + dur(v.resets_in_min) : "";
        c.fillStyle = ink3; c.font = '400 11px ' + MON;
        c.textAlign = "right"; c.fillText(rightTxt, W - padR, y - 6); c.textAlign = "left";
        const x0 = padL, x1 = W - padR - (narrow ? 62 : 92), bw = Math.max(40, x1 - x0), bh = 13;
        c.fillStyle = cssvar("--bedfill"); c.fillRect(x0, y, bw, bh);
        c.save(); c.beginPath(); c.rect(x0, y, bw, bh); c.clip();
        c.strokeStyle = hair; c.lineWidth = 1;
        for (let x = x0 - bh; x < x0 + bw; x += 6) { c.beginPath(); c.moveTo(x, y + bh); c.lineTo(x + bh, y); c.stroke(); }
        c.restore();
        c.fillStyle = col; c.fillRect(x0, y, bw * pct / 100, bh);
        c.strokeStyle = rule; c.lineWidth = 1; c.strokeRect(x0 + .5, y + .5, bw - 1, bh - 1);
        c.strokeStyle = ink3; c.globalAlpha = .5;
        [25, 50, 75].forEach(t => { const x = x0 + bw * t / 100; c.beginPath(); c.moveTo(x + .5, y + bh); c.lineTo(x + .5, y + bh + 3); c.stroke(); });
        c.globalAlpha = 1;
        c.fillStyle = pct >= 85 ? vug : ink; c.font = '400 ' + (narrow ? 18 : 21) + 'px ' + MON;
        c.textBaseline = "middle";
        c.fillText(Math.round(pct) + "%", x1 + 10, y + bh / 2 + 1);
        c.textBaseline = "alphabetic";
      });
      if (lim.stale) {
        c.fillStyle = vug; c.font = '300 italic 11.5px ' + SER;
        c.fillText("this sample is " + dur(lim.age_minutes) + " old", padL, R1 - 6);
      }
      c.strokeStyle = hair; c.beginPath(); c.moveTo(padL, R1 - 0.5); c.lineTo(W - padR, R1 - 0.5); c.stroke();
    }

    /* --- register 2: the utilisation samples --- */
    const hist = (lim && lim.history) ? lim.history.slice().filter(h => h.five_hour_pct !== null || h.seven_day_pct !== null) : [];
    const top2 = R1 + 8, bot2 = R1 + R2 - 22;
    c.fillStyle = ink2; c.font = '300 italic 12.5px ' + SER;
    c.fillText("utilisation as sampled over the last " + ((lim && lim.history_days) || 14) + " days", padL, top2 + 10);
    if (hist.length < 2) {
      c.fillStyle = ink3; c.font = '300 italic 12px ' + SER;
      c.fillText(hist.length ? "one sample so far — a line needs two." : "no samples yet.", padL, bot2 - 2);
    } else {
      const ts = hist.map(h => +d(h.ts));
      const t0 = Math.min.apply(null, ts), t1 = Math.max(Math.max.apply(null, ts), Date.now());
      const X = t => padL + (t - t0) / Math.max(1, t1 - t0) * (W - padL - padR);
      const Y = p => bot2 - (Math.max(0, Math.min(100, p)) / 100) * (bot2 - top2 - 14);
      c.strokeStyle = hair; c.lineWidth = 1;
      [0, 50, 100].forEach(p => { c.beginPath(); c.moveTo(padL, Y(p) + .5); c.lineTo(W - padR, Y(p) + .5); c.stroke(); });
      c.fillStyle = ink3; c.font = '400 9.5px ' + MON;
      c.fillText("100", W - padR - 20, Y(100) - 3);
      [["five_hour_pct", warm, [3, 3]], ["seven_day_pct", cssvar("--k-research"), []]].forEach(spec => {
        const pts = hist.filter(h => h[spec[0]] !== null && h[spec[0]] !== undefined);
        if (pts.length < 2) return;
        c.strokeStyle = spec[1]; c.lineWidth = 1.4; c.setLineDash(spec[2]);
        c.beginPath();
        pts.forEach((h, i) => { const x = X(+d(h.ts)), y = Y(h[spec[0]]); i ? c.lineTo(x, y) : c.moveTo(x, y); });
        c.stroke(); c.setLineDash([]);
        const last = pts[pts.length - 1];
        c.fillStyle = spec[1];
        c.beginPath(); c.arc(X(+d(last.ts)), Y(last[spec[0]]), 2.4, 0, 6.2832); c.fill();
      });
      c.fillStyle = warm; c.font = '400 10px ' + MON; c.fillText("5h", padL, top2 + 24);
      c.fillStyle = cssvar("--k-research"); c.fillText("7d", padL + 22, top2 + 24);
      if (t1 - t0 < 6 * 36e5 && !narrow) {
        c.fillStyle = ink3; c.font = '300 italic 11px ' + SER;
        c.fillText("every sample so far is from the last " + dur((t1 - t0) / 60000) + " — the history fills out as sessions run",
          padL + 44, top2 + 24);
      }
    }
    c.strokeStyle = hair; c.beginPath(); c.moveTo(padL, R1 + R2 - 0.5); c.lineTo(W - padR, R1 + R2 - 0.5); c.stroke();

    /* --- register 3: daily burn, stacked by model family --- */
    const rows = (this.data.sum && this.data.sum.by_day) || [];
    const top3 = R1 + R2 + 10, bot3 = H - 18;
    c.fillStyle = ink2; c.font = '300 italic 12.5px ' + SER;
    c.fillText("tokens burned each day, stacked by model family", padL, top3 + 10);
    if (!rows.length) {
      c.fillStyle = ink3; c.font = '300 italic 12px ' + SER;
      c.fillText("no usage rows in this window.", padL, bot3 - 4);
      return;
    }
    const byDay = {}, fams = {};
    rows.forEach(r => {
      const total = (r.input_tokens || 0) + (r.output_tokens || 0) + (r.cache_read || 0) + (r.cache_create || 0);
      (byDay[r.day] = byDay[r.day] || {})[r.family || "other"] = ((byDay[r.day] || {})[r.family || "other"] || 0) + total;
      fams[r.family || "other"] = (fams[r.family || "other"] || 0) + total;
    });
    const days = Object.keys(byDay).sort();
    const famList = Object.keys(fams).sort((a, b) => fams[b] - fams[a]);
    const dayMax = Math.max.apply(null, days.map(k => Object.values(byDay[k]).reduce((a, b) => a + b, 0)).concat([1]));
    const d0 = +d(days[0] + "T00:00:00Z"), d1 = Math.max(+d(days[days.length - 1] + "T00:00:00Z"), Date.now());
    const X3 = t => padL + (t - d0) / Math.max(864e5, d1 - d0) * (W - padL - padR);
    const bw3 = Math.max(2, Math.min(22, (W - padL - padR) / Math.max(1, (d1 - d0) / 864e5 + 1) - 1.5));
    const sevenAgo = Date.now() - 7 * 864e5;
    c.fillStyle = ink; c.globalAlpha = 0.05;
    c.fillRect(X3(sevenAgo), top3 + 16, (W - padR) - X3(sevenAgo), bot3 - top3 - 16);
    c.globalAlpha = 1;
    c.strokeStyle = hair; c.setLineDash([2, 2]);
    c.beginPath(); c.moveTo(X3(sevenAgo) + .5, top3 + 16); c.lineTo(X3(sevenAgo) + .5, bot3); c.stroke(); c.setLineDash([]);
    c.fillStyle = ink3; c.font = '400 9.5px ' + MON;
    c.fillText("last 7 days", X3(sevenAgo) + 4, top3 + 25);
    this.bars3 = [];
    days.forEach(day => {
      const x = X3(+d(day + "T00:00:00Z")) - bw3 / 2;
      let y = bot3;
      famList.forEach(f => {
        const v = byDay[day][f] || 0; if (!v) return;
        const h = (v / dayMax) * (bot3 - top3 - 26);
        c.fillStyle = famColor(f);
        c.globalAlpha = this.hover && this.hover.day !== day ? 0.32 : 0.92;
        c.fillRect(x, y - h, bw3, h);
        y -= h;
      });
      c.globalAlpha = 1;
      this.bars3.push({ day: day, x: x, w: bw3, total: Object.values(byDay[day]).reduce((a, b) => a + b, 0), by: byDay[day] });
    });
    c.strokeStyle = rule; c.lineWidth = 1;
    c.beginPath(); c.moveTo(padL, bot3 + .5); c.lineTo(W - padR, bot3 + .5); c.stroke();
    c.fillStyle = ink3; c.font = '400 9.5px ' + MON;
    days.forEach((day, i) => {
      const dt = d(day + "T00:00:00Z");
      if (dt.getUTCDay() !== 1 && i !== 0) return;
      c.fillText(dt.getUTCDate() + " " + MONTHS[dt.getUTCMonth()].slice(0, 3), X3(+dt) - 8, bot3 + 13);
    });
    if (W >= 560) {
      c.font = '400 10px ' + MON;
      let lx = padL + 260;
      famList.forEach(f => {
        const wf = c.measureText(f).width + 27;
        if (lx + wf > W - padR) return;
        c.fillStyle = famColor(f); c.fillRect(lx, top3 + 2, 8, 8);
        c.fillStyle = ink2; c.fillText(f, lx + 11, top3 + 10);
        lx += wf;
      });
    } else {
      c.font = '300 italic 10.5px ' + SER; c.fillStyle = ink3;
      c.fillText(famList.join(", "), padL, top3 + 22);
    }
  },

  point(e) {
    if (!this.bars3 || !this.geo) return;
    const b = this.cv.getBoundingClientRect(), x = e.clientX - b.left, y = e.clientY - b.top;
    const t = $("#utip");
    if (y < this.geo.R1 + this.geo.R2) { this.hover = null; t.setAttribute("data-on", "0"); return; }
    let hit = null;
    this.bars3.forEach(bar => { if (x >= bar.x - 2 && x <= bar.x + bar.w + 2) hit = bar; });
    if (!hit) { if (this.hover) { this.hover = null; this.draw(); } t.setAttribute("data-on", "0"); return; }
    if (!this.hover || this.hover.day !== hit.day) { this.hover = hit; this.draw(); }
    clear(t);
    t.appendChild(el("b", { text: fmtLong(hit.day + "T00:00:00Z") }));
    t.appendChild(el("span", { text: tok(hit.total) + " tokens" }));
    Object.keys(hit.by).sort((a, c2) => hit.by[c2] - hit.by[a]).forEach(f =>
      t.appendChild(el("span", { class: "kindline", text: f + "  " + tok(hit.by[f]) })));
    t.setAttribute("data-on", "1");
    const tw = t.offsetWidth || 180;
    t.style.left = Math.max(4, Math.min(this.geo.W - tw - 6, x + 14)) + "px";
    t.style.top = Math.max(4, y - 40) + "px";
  },

  heat(host, an) {
    host.appendChild(el("h3", { class: "sec", text: "when the work happens, hour by hour (local time)" }));
    const byHour = {};
    an.by_hour_of_day.forEach(r => { byHour[r.hour_ist] = r; });
    const rowsByDay = an.by_weekday || [];
    const maxH = Math.max.apply(null, an.by_hour_of_day.map(r => r.calls).concat([1]));
    const grid = el("div", { class: "heat", "aria-hidden": "true" });
    grid.appendChild(el("span", { class: "hlab" }));
    for (let h = 0; h < 24; h++) grid.appendChild(el("span", { class: "htop", text: h % 3 === 0 ? String(h) : "" }));
    grid.appendChild(el("span", { class: "hlab", text: "calls" }));
    for (let h = 0; h < 24; h++) {
      const r = byHour[h] || { calls: 0, cost_usd_est: 0 };
      const a = Math.pow(r.calls / maxH, 0.6);
      grid.appendChild(el("span", { class: "cell",
        title: h + ":00 — " + r.calls.toLocaleString("en-US") + " calls, " + money(r.cost_usd_est),
        style: "--kc:" + cssvar("--k-build") + ";opacity:" + (0.09 + a * 0.91).toFixed(2) }));
    }
    if (rowsByDay.length) {
      const maxD = Math.max.apply(null, rowsByDay.map(r => r.calls).concat([1]));
      grid.appendChild(el("span", { class: "hlab", text: "week" }));
      rowsByDay.slice().sort((a, b) => a.weekday - b.weekday).forEach(r => {
        const a = Math.pow(r.calls / maxD, 0.6);
        const cell = el("span", { class: "cell", style: "--kc:" + cssvar("--k-research") + ";opacity:" + (0.09 + a * 0.91).toFixed(2),
          title: r.name + " — " + r.calls.toLocaleString("en-US") + " calls, " + money(r.cost_usd_est) });
        cell.style.gridColumn = "span 3";
        grid.appendChild(cell);
      });
      grid.appendChild(el("span", { class: "cell", style: "opacity:0" }));
      grid.appendChild(el("span", { class: "cell", style: "opacity:0" }));
      grid.appendChild(el("span", { class: "cell", style: "opacity:0" }));
    }
    host.appendChild(grid);
    const det = el("details", { class: "alt" }, [el("summary", { text: "Read the hour and weekday figures as a table" })]);
    const wrap = el("div", { class: "alttable" });
    const tb = el("table");
    tb.appendChild(el("thead", {}, [el("tr", {}, ["slot", "calls", "tokens", "estimated cost"].map(h => el("th", { text: h, scope: "col" })))]));
    const body = el("tbody");
    an.by_hour_of_day.forEach(r => body.appendChild(el("tr", {}, [
      el("td", { text: r.hour_ist + ":00" }), el("td", { text: r.calls.toLocaleString("en-US") }),
      el("td", { text: tok(r.tokens) }), el("td", { text: money(r.cost_usd_est) })])));
    (an.by_weekday || []).forEach(r => body.appendChild(el("tr", {}, [
      el("td", { text: r.name }), el("td", { text: r.calls.toLocaleString("en-US") }),
      el("td", { text: tok(r.tokens) }), el("td", { text: money(r.cost_usd_est) })])));
    tb.appendChild(body); wrap.appendChild(tb); det.appendChild(wrap);
    host.appendChild(det);
  }
};

  draw() {
    const cv = this.cv, box = cv && cv.parentElement; if (!cv || !box) return;
    const ss = (this.data && this.data.now && this.data.now.sessions) || [];
    const rowH = 30, W = box.clientWidth, H = Math.max(84, 26 + Math.max(1, ss.length) * rowH);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

      c.strokeStyle = hair; c.beginPath(); c.moveTo(14, 64.5); c.lineTo(W - 14, 64.5); c.stroke();
      return;
    }
    const t = Date.now() / 1000;
    const padL = Math.min(190, Math.max(90, W * 0.2));
    ss.forEach((x, i) => {
      const y = 30 + i * rowH + rowH / 2;
      c.fillStyle = cssvar("--ink"); c.font = '400 11.5px ' + MON;
      c.textAlign = "right";
      const nm = (x.project || "?") + " " + String(x.pid);
      c.fillText(nm.length > 22 ? nm.slice(0, 21) + "…" : nm, padL - 10, y + 4);
      c.textAlign = "left";
      const idle = Math.max(0, Number(x.idle_s) || 0);
      const live = Math.max(0.05, Math.exp(-idle / 240));
      const col = idle < 90 ? good : idle < 900 ? warm : cssvar("--ink-2");
      c.strokeStyle = col; c.lineWidth = idle < 90 ? 1.4 : 1.1;
      c.globalAlpha = idle < 900 ? 1 : 0.7;
      c.beginPath();
      const x0 = padL, x1 = W - 96, amp = (rowH * 0.34) * Math.max(0.14, live);
      for (let px = x0; px <= x1; px += 2) {
        const u = (px - x0) / (x1 - x0);
        const phase = REDUCED.matches ? 0 : t * 0.85;
        const beat = Math.exp(-Math.pow(((u * 6 + phase) % 6) - 3, 2) * 6);
        const wob = Math.sin(u * 26 + i * 2.1) * 0.12;
        const yy = y - (beat * 2 - 0.35 * Math.exp(-Math.pow(((u * 6 + phase) % 6) - 3.35, 2) * 22)) * amp + wob * amp;
        px === x0 ? c.moveTo(px, yy) : c.lineTo(px, yy);
      }
      c.stroke(); c.globalAlpha = 1;
      c.fillStyle = idle < 90 ? cssvar("--ink-2") : ink3; c.font = '400 10.5px ' + MON;
      c.textAlign = "right";
      c.fillText(elapsed(x.elapsed_s, x.elapsed), W - 16, y + 4);
      c.textAlign = "left";
      c.strokeStyle = hair; c.lineWidth = 1;
      c.beginPath(); c.moveTo(padL, y + rowH / 2 - .5); c.lineTo(W - 96, y + rowH / 2 - .5); c.stroke();
    });
  }
};

      const x = X(h), major = h % 6 === 0;
      c.strokeStyle = major ? rule : hair;
      c.beginPath(); c.moveTo(x + .5, base); c.lineTo(x + .5, base + (major ? 6 : 3)); c.stroke();
      if (major && h < 24) { c.fillStyle = ink3; c.fillText(String(h).padStart(2, "0") + ":00", x + 2, base + 18); }
    }
    const nowH = (() => { const n = new Date(); return n.getHours() + n.getMinutes() / 60; })();
    c.strokeStyle = vug; c.lineWidth = 1;
    c.beginPath(); c.moveTo(X(nowH), 24); c.lineTo(X(nowH), base); c.stroke();
    c.fillStyle = vug; c.beginPath(); c.arc(X(nowH), 24, 2.2, 0, 6.2832); c.fill();
    const lanes = [];
    jobs.forEach(j => {
      const colour = j.status === "healthy" ? good : j.status === "stale" ? warm : j.status === "failing" ? vug : ink3;
      const t = j.next_fire ? d(j.next_fire) : null;
      if (t) {
        const h = t.getHours() + t.getMinutes() / 60;
        lanes.push({ x: X(h), col: colour, label: j.label, kind: "fire" });
      } else if (/interval|kept alive|at load/i.test(j.schedule || "")) {
        const m = /every\s+(\d+)\s*(second|minute|hour)/i.exec(j.schedule || "");
        let every = m ? (Number(m[1]) * (m[2].toLowerCase() === "hour" ? 60 : m[2].toLowerCase() === "minute" ? 1 : 1 / 60)) : null;
        if (every && every < 720) {
          for (let h = 0; h < 24; h += Math.max(0.5, every / 60)) lanes.push({ x: X(h), col: colour, label: j.label, kind: "cycle" });
        } else lanes.push({ x: X(nowH), col: colour, label: j.label, kind: "always" });
      }
    });
    const slots = [];
    lanes.forEach(L => {
      let row = 0;
      while (slots[row] && slots[row].some(v => Math.abs(v - L.x) < 3)) row++;
      (slots[row] = slots[row] || []).push(L.x);
      const y = base - 8 - row * 9;
      if (y < 26) return;
      c.strokeStyle = L.col; c.fillStyle = L.col; c.lineWidth = 1.2;
      if (L.kind === "cycle") { c.globalAlpha = .55; c.fillRect(L.x - 1, y - 3, 2, 6); c.globalAlpha = 1; }
      else if (L.kind === "always") { c.globalAlpha = .8; c.beginPath(); c.arc(L.x, y, 3, 0, 6.2832); c.stroke(); c.globalAlpha = 1; }
      else { c.beginPath(); c.moveTo(L.x, y + 4); c.lineTo(L.x, y - 4); c.stroke(); c.beginPath(); c.arc(L.x, y - 5.5, 2, 0, 6.2832); c.fill(); }
    });
    const by = (this.data && this.data.by_status) || {};
    c.font = '400 10px ' + MON;
    let lw = 0;
    Object.keys(by).forEach(k => { lw += c.measureText(by[k] + " " + k).width + 26; });
    let lx = Math.max(padL, W - padR - lw);
    Object.keys(by).forEach(k => {
      const colour = k === "healthy" ? good : k === "stale" ? warm : k === "failing" ? vug : ink3;
      c.fillStyle = colour; c.fillRect(lx, 9, 7, 7);
      c.fillStyle = ink2; c.fillText(by[k] + " " + k, lx + 10, 16);
      lx += c.measureText(by[k] + " " + k).width + 26;
    });
  }
};

  spark(vals, w, h) {
    const cv = el("canvas", { width: String(w * 2), height: String(h * 2), style: "width:" + w + "px;height:" + h + "px;vertical-align:middle",
      "aria-hidden": "true" });
    const c = cv.getContext("2d");

    const bw = Math.max(1.5, w / Math.max(1, vals.length) - 1);
    c.fillStyle = cssvar("--k-build");
    vals.forEach((v, i) => {
      const bh = Math.max(1, (v / max) * (h - 2));

    });
    return cv;

  add(" were reconstructed from transcripts afterwards, and "); num(String(t.unlogged), "warn");

  if (t.bypassed) { add(" ("); num(String(t.bypassed), "warn"); add(" of those pushed past the stop gate)"); }

async function loadStats() {

let currentView = null;
async function route() {
  const hash = location.hash.replace(/^#\/?/, "");
  const parts = hash.split("/");
  let view = parts[0] || "today";
  if (!VIEWS[view]) view = "today";
  const param = parts[1] ? decodeURIComponent(parts[1]) : null;
  const sameView = view === S.view && currentView;
  S.view = view; S.param = param;
  renderRail();
  renderMasthead();
  if (sameView) {
    if (param && VIEWS[view].param) VIEWS[view].param(param);
    return;
  }
  if (currentView && VIEWS[currentView] && VIEWS[currentView].unmount) VIEWS[currentView].unmount();
  const root = clear($("#viewroot"));
  root.appendChild(el("p", { class: "loading", text: "Reading…" }));
  currentView = view;
  clear(root);
  try { await VIEWS[view].mount(root); }
  catch (e) {
    clear(root).appendChild(el("div", { class: "fail" }, [
      el("h3", { text: "That view did not open" }), el("p", { text: e.message })]));
  }
  renderMasthead();
}

/* =====================================================================
   CC feeds — a small live snapshot an optional mascot/overlay script
   (mascot/mascot.js, not shipped) can poll without knowing the API.
   ===================================================================== */
const CC = window.CC = {
  version: 1,
  /* a live snapshot the creature can poll without knowing about the API */
  feeds: {
    items: 0,              /* ledger entries, rises when something new is logged */
    unlogged: 0,
    severity: "normal",    /* normal | warning | critical, from the binding usage window */
    usedPct: 0,
    liveSessions: 0,
    nextReset: null,       /* ISO */
    nextResetIST: null,
    nextResetInMin: null,
    costToday: null,
    costTotal: 0,
    firstDate: null,
    stale: false,
    updatedAt: null
  },
  /* helpers the creature calls for its speech bubble */
  async randomItem() {
    try {
      const r = await API.get("/api/items?" + qs({ limit: 60, sort: "date" }));
      if (!r || !r.items.length) return null;
      const it = r.items[Math.floor(Math.random() * r.items.length)];
      return { id: it.id, title: it.title, kind: it.kind, project: it.project,
               date: fmtLong(it.built_at || it.created_at), href: "#/ledger/" + it.id };
    } catch (e) { return null; }
  },
  go(hash) { location.hash = hash; },
  toast: msg => toast(msg),
  money: money, fmtLong: fmtLong, fmtDay: fmtDay,
  reducedMotion: () => REDUCED.matches,
  theme: () => (document.documentElement.getAttribute("data-theme") ||
                (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")),
  /* the creature registers itself here; the app then uses it for the favicon
     and for the empty-state drawing, and re-renders it when the theme flips */
  mascot: null,
  register(api) {
    CC.mascot = api || null;
    try { if (api && api.favicon) CC.setFavicon(api.favicon()); } catch (e) {}
    $$(".emptyart").forEach(n => CC.fillEmptyArt(n));
  },
  setFavicon(href) {
    if (!href) return;
    const link = document.querySelector("link[rel='icon']") || el("link", { rel: "icon" });
    link.setAttribute("type", "image/png");
    link.setAttribute("href", href);
    document.head.appendChild(link);
  },
  /* an empty state asks the creature for a still; if it is not loaded the
     panel is simply text, which is what it was before */
  emptyArt(message, px) {
    const box = el("div", { class: "emptyart" }, [el("p", { text: message })]);
    box.dataset.px = String(px || 46);
    CC.fillEmptyArt(box);
    return box;
  },
  fillEmptyArt(box) {
    const had = $("canvas", box); if (had) had.remove();
    const m = CC.mascot;
    if (!m || !m.still) return;
    try {
      const node = m.still({ px: Number(box.dataset.px || 46), pose: "sleepy" });
      if (node) { node.setAttribute("aria-hidden", "true"); box.insertBefore(node, box.firstChild); }
    } catch (e) {}
  },
  async refreshFeeds() {
    const [st, lim, live] = await Promise.all([
      API.get("/api/stats").catch(() => null),
      modGet("/api/usage/limits").catch(() => null),
      modGet("/api/live/sessions").catch(() => null)
    ]);
    const f = CC.feeds, prev = f.items;
    if (st && st.totals) {
      f.items = st.totals.items; f.unlogged = st.totals.unlogged;
      f.costTotal = st.totals.cost_usd; f.firstDate = st.first_date;
    }
    f.liveSessions = (live && live.count) || 0;
    if (lim) {
      f.stale = !!lim.stale;
      let worst = 0, binding = null;
      if (lim.current) ["five_hour", "seven_day"].forEach(k => {
        const v = lim.current[k];
        if (v && (Number(v.used_pct) || 0) >= worst) { worst = Number(v.used_pct) || 0; binding = v; }
      });
      f.usedPct = worst;
      f.severity = lim.severity || (worst >= 90 ? "critical" : worst >= 75 ? "warning" : "normal");
      if (binding) { f.nextReset = binding.resets_at; f.nextResetIST = binding.resets_at_ist; f.nextResetInMin = binding.resets_in_min; }
    }
    f.updatedAt = new Date().toISOString();
    if (prev && f.items > prev && CC.mascot && CC.mascot.trigger) { try { CC.mascot.trigger("new_item"); } catch (e) {} }
    if (CC.mascot && CC.mascot.update) { try { CC.mascot.update(f); } catch (e) {} }
    return f;
  },
  async bootMascot() {
    const mount = $("#mascot-mount"); if (!mount) return;
    await CC.refreshFeeds();
    setInterval(() => { if (document.visibilityState === "visible") CC.refreshFeeds(); }, 30000);
    window.addEventListener("cc-theme", () => { if (CC.mascot && CC.mascot.repaint) CC.mascot.repaint(); });
    /* mascot/mascot.js defines createMascot(mountEl, opts); it may also load later */
    const start = () => {
      if (typeof window.createMascot !== "function") return false;
      try {
        const api = window.createMascot(mount, {
          api: CC, feeds: CC.feeds, reducedMotion: REDUCED.matches,
          spriteUrl: "/mascot/sprite.json", theme: CC.theme()
        });
        CC.register(api || null);
        mount.setAttribute("data-live", "1");
        return true;
      } catch (e) { db_log("mascot failed to start: " + e.message); return true; }
    };
    if (!start()) {
      let tries = 0;
      const iv = setInterval(() => { if (start() || ++tries > 40) clearInterval(iv); }, 250);
    }
  }
};
function db_log(msg) { try { console.warn("[command centre] " + msg); } catch (e) {} }

/* =====================================================================
   COMMAND PALETTE — one box over every view, project, entry, job,
   memory, skill and action in the centre.
   ===================================================================== */
const Palette = {
  index: null, built: 0, rows: [], sel: 0,
  async open(prefill) {
    const dlg = $("#palette"), input = $("#pinput");
    if (!dlg.open) dlg.showModal();
    input.value = prefill || "";
    await this.build();
    this.filter(input.value);
    input.focus(); input.select();
  },
  close() { const dlg = $("#palette"); if (dlg.open) dlg.close(); },
  async build() {
    if (this.index && Date.now() - this.built < 60000) return;
    const [items, jobs, mem, cfg, live] = await Promise.all([
      API.get("/api/items?" + qs({ limit: 400, sort: "date" })).catch(() => null),
      modGet("/api/jobs").catch(() => null),
      modGet("/api/memory/index").catch(() => null),
      modGet("/api/config/overview").catch(() => null),
      modGet("/api/live/recent?hours=72").catch(() => null)
    ]);
    const ix = [];
    Object.keys(VIEWS).forEach(k => ix.push({ kind: "view", title: VIEWS[k].title, hint: "go", run: () => { location.hash = "#/" + k; } }));
    ((S.stats && S.stats.projects) || []).forEach(pr => ix.push({
      kind: "project", title: pr.project, hint: pr.items + " entries",
      run: () => { location.hash = "#/ledger"; setTimeout(() => { S.filters.projects = [pr.project]; Ledger.renderFilters(); Ledger.load(); }, 240); } }));
    (items ? items.items : []).forEach(i => ix.push({
      kind: "entry", title: i.title, hint: i.project || i.kind, run: () => { location.hash = "#/ledger/" + i.id; } }));
    ((jobs && jobs.jobs) || []).forEach(j => ix.push({
      kind: "job", title: j.label, hint: j.status, run: () => { location.hash = "#/jobs"; } }));
    ((mem && mem.files) || []).slice(0, 250).forEach(f => ix.push({
      kind: "memory", title: f.name, hint: f.project || "memory", run: () => { location.hash = "#/memory/" + encodeURIComponent(f.path); } }));
    ((cfg && cfg.skills) || []).forEach(k => ix.push({
      kind: "skill", title: k.name, hint: k.scope, run: () => { location.hash = "#/config"; } }));
    ((live && live.sessions) || []).slice(0, 20).forEach(x => ix.push({
      kind: "resume", title: "resume " + (x.title || String(x.session_id).slice(0, 8)), hint: x.project || "",
      run: () => Ledger.copy(x.resume_cmd || "") }));
    [
      ["action", "Write a quick note", "⌘J", () => quickNote()],
      ["action", "Search the transcripts", "", () => { location.hash = "#/search"; }],
      ["action", "Show the sessions that logged nothing", "", () => { location.hash = "#/audit"; }],
      ["action", "Switch between light and dark", "", () => $("#themebtn").click()],
      ["action", "Rebuild the search index", "", () => System.act("rebuild_fts", "Rebuild the search index")],
      ["action", "Run the backfill over the transcripts", "", () => System.act("backfill", "Run the backfill")],
      ["action", "Open the tracker log folder", "", () => System.act("open_logs", "Open the log folder")],
      ["action", "Restart the tracker server", "", () => System.act("restart_server", "Restart the server")],
      ["action", "Copy the path to tracker.db", "", () => Ledger.copy((S.stats && S.stats.db) || "")]
    ].forEach(a => ix.push({ kind: a[0], title: a[1], hint: a[2], run: a[3] }));
    this.index = ix; this.built = Date.now();
  },
  score(q, str) {
    const t = str.toLowerCase();
    if (!q) return 1;
    if (t === q) return 1000;
    if (t.startsWith(q)) return 500 - t.length * 0.1;
    const at = t.indexOf(q);
    if (at >= 0) return 300 - at - t.length * 0.05;
    let qi = 0, last = -1, gaps = 0;
    for (let i = 0; i < t.length && qi < q.length; i++) {
      if (t[i] === q[qi]) { if (last >= 0) gaps += i - last - 1; last = i; qi++; }
    }
    return qi === q.length ? 120 - gaps * 0.6 - t.length * 0.03 : 0;
  },
  filter(raw) {
    const q = String(raw || "").trim().toLowerCase();
    const scored = [];
    (this.index || []).forEach(r => {
      const sc = this.score(q, r.title + " " + (r.hint || "") + " " + r.kind);
      if (sc > 0) scored.push({ r: r, s: sc + (r.kind === "view" ? 40 : r.kind === "action" ? 20 : 0) });
    });
    scored.sort((a, b) => b.s - a.s);
    this.rows = scored.slice(0, 40).map(x => x.r);
    this.sel = 0;
    this.render();
  },
  render() {
    const ul = clear($("#plist"));
    if (!this.rows.length) { ul.appendChild(el("li", { class: "pempty", text: "Nothing matches that." })); return; }
    this.rows.forEach((r, i) => {
      const li = el("li", { role: "option", id: "p-" + i, "aria-selected": String(i === this.sel),
        onclick: () => this.go(i) });
      li.appendChild(el("span", { class: "pk", text: r.kind }));
      li.appendChild(el("span", { class: "pt", text: r.title }));
      if (r.hint) li.appendChild(el("span", { class: "ps", text: r.hint }));
      ul.appendChild(li);
    });
    $("#pinput").setAttribute("aria-activedescendant", "p-" + this.sel);
    const node = $("#p-" + this.sel);
    if (node) node.scrollIntoView({ block: "nearest" });
  },
  move(n) {
    if (!this.rows.length) return;
    this.sel = (this.sel + n + this.rows.length) % this.rows.length;
    this.render();
  },
  go(i) {
    const r = this.rows[i === undefined ? this.sel : i];
    if (!r) return;
    this.close();
    setTimeout(() => r.run(), 30);
  },
  wire() {
    const input = $("#pinput"), dlg = $("#palette");
    input.addEventListener("input", () => this.filter(input.value));
    input.addEventListener("keydown", e => {
      if (e.key === "ArrowDown") { e.preventDefault(); this.move(1); }
      else if (e.key === "ArrowUp") { e.preventDefault(); this.move(-1); }
      else if (e.key === "Enter") { e.preventDefault(); this.go(); }
    });
    dlg.addEventListener("click", e => { if (e.target === dlg) this.close(); });
  }
};

/* ---------------------------------------------------------- global keys */
document.addEventListener("keydown", e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName) || document.activeElement.isContentEditable;
  if ((e.metaKey || e.ctrlKey) && (e.key === "k" || e.key === "K")) { e.preventDefault(); Palette.open(""); return; }
  if ((e.metaKey || e.ctrlKey) && (e.key === "j" || e.key === "J")) { e.preventDefault(); quickNote(); return; }
  if (e.key === "Escape" && $("#palette").open) { Palette.close(); return; }
  if (e.key === "/" && !typing) {
    const q = $("#q");
    if (q) { e.preventDefault(); q.focus(); q.select(); }
    else { location.hash = "#/ledger"; setTimeout(() => { const n = $("#q"); if (n) n.focus(); }, 260); }
  } else if (e.key === "Escape") {
    if ($("#confirm").open) return;
    if (S.detail) { Ledger.close(); }
    else if (Core.brush) { Core.clearBrush(); Ledger.setRange(null); }
  } else if (!typing && (e.key === "g" || e.key === "G")) {
    window.__g = true; setTimeout(() => { window.__g = false; }, 900);
  } else if (!typing && window.__g) {
    const map = { t: "today", l: "ledger", a: "audit", u: "usage", s: "search", m: "memory",
                  p: "launch", j: "jobs", c: "config", y: "system", v: "live" };
    if (map[e.key]) { location.hash = "#/" + map[e.key]; window.__g = false; }
  }
});

/* ---------------------------------------------------------- boot */
(async function boot() {
  initTheme();
  Palette.wire();
  window.addEventListener("hashchange", route);
  window.addEventListener("resize", debounce(() => renderMasthead(), 180));
  await loadStats();
  if (!location.hash) location.hash = "#/today";
  await route();
  Strip.mount(true);            // chrome loads after the view has painted
  CC.bootMascot();
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && Core.lanes.length) Core.animate(); });
})();
</script>
<script src="/mascot/mascot.js" defer onerror="console.warn('[command centre] mascot/mascot.js is not there yet')"></script>
